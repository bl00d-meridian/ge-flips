<script>
(async function(){
  const out = [];
  const ok = (name, cond, extra) => out.push((cond ? "PASS " : "FAIL ") + name + (cond ? "" : " :: " + (extra || "")));
  /* THE BROAD-CONTAINER TELL (user ruling, Aug 12 2026). An assertion that
     matches against a container broader than the thing under test can run on
     real production output, exercise real production code, and still pass with
     the property deleted from its subject — because some OTHER element on the
     page satisfied the pattern. [R49.2] did exactly that: it checked that a
     specific per-gate fill rate carries its cohort split by matching
     /watchlist 100% of 2/ against the whole page's HTML.

     blendFrag narrows the match to the one blend under test: the element whose
     data-drill key is `key`, plus the inline decomposition span rateBlend()
     emits immediately after it. Returns "" when the key is absent, so a
     vanished blend fails rather than matching nothing quietly. This LOCATES an
     element; it does not compute the expected value — the split it matches is
     still produced entirely by production code. */
  const blendFrag = (html, key) => {
    const d = document.createElement("div");
    d.innerHTML = html;
    /* Quoted attribute value: only backslash and the quote itself need escaping.
       CSS.escape is for identifiers and would mangle the spaces and "·" these
       drill keys carry. */
    const btn = d.querySelector('[data-drill="' + String(key).replace(/[\\"]/g, "\\$&") + '"]');
    if (!btn) return "";
    return btn.outerHTML + (btn.nextElementSibling ? btn.nextElementSibling.outerHTML : "");
  };
  /* ONE BAND'S BULLET, not the whole regime section (the same tell, one
     surface along). regimeSeparatorSection renders every band into one string,
     so a bare /inert/ over the section is satisfied by ANY band — which is how
     the old [R65.2] assertion sat green through a live eligibility change that
     moved its own band into a different state. Defined here beside blendFrag,
     at IIFE scope, because three separate try-blocks need it: a helper block-
     scoped to the first one is invisible to the others and fails at run time,
     not at parse time. */
  const sepFrag = (html, key) => {
    const lab = (REGIME_DEFS().find(r => r.key === key) || {}).lab || key;
    return String(html).split('<div style="margin-top:4px">• ')
      .filter(p => p.indexOf("<b>" + lab + "</b>") === 0)[0] || "";
  };
  /* The early stub traps app-script parse errors, but its beacon is overwritten
     by this report — so surface them HERE, first. Without this a syntax error
     in index.html reads as a cascade of "x is not defined" with no cause. */
  if (window.__probeErrs && window.__probeErrs.length)
    for (const e of window.__probeErrs) out.push("FAIL app script error (nothing below ran) :: " + e);
  try {
    window.prompt = () => null; window.confirm = () => true;

    // ---- pure unit tests ----
    ok("pearson +1", Math.abs(pearson([1,2,3,4],[2,4,6,8]) - 1) < 1e-9);
    ok("pearson -1", Math.abs(pearson([1,2,3,4],[8,6,4,2]) + 1) < 1e-9);
    ok("pearson flat null", pearson([1,1,1,1],[1,2,3,4]) === null);
    const dr = dailyRetMap([{d:"2026-08-01",mid:100},{d:"2026-08-02",mid:110},{d:"2026-08-04",mid:121}]);
    ok("dailyRetMap consecutive only", dr.size === 1 && Math.abs(dr.get("2026-08-02") - 0.1) < 1e-9, JSON.stringify([...dr]));
    ok("cluSig sorted", cluSig([5,2,9]) === "2,5,9");

    // ---- clean fixture state ----
    DB.flips = []; DB.positions = []; DB.invLots = []; DB.watch = [];
    DB.clusters = []; DB.clusterCands = []; DB.blacklist = [];
    DB.scoutOn = false; DB.planPriority = []; DB.planDemoted = [];
    DB.bank = 500e6; DB.bankAsOf = Date.now(); DB.shadowReserve = 300e6;
    DB.reserve = 3e6; DB.t1Budget = 100e6; DB.t2Budget = 50e6; DB.slots = 7;
    DB.minExpectGp = 0; DB.clusterCapPct = 8; DB.lastCoScanAt = Date.now();
    DB.touchLog = [{d: today(), m: "walkup", t: Date.now()}];
    /* Context-aware checklist state (R21): the probe profile's localStorage
       persists across runs, so a prior run's review engagement or collapse
       preference would leak into this one — neutralize it up front. */
    DB.reviewEngagedAt = 0; DB.ckPref = ""; DB.ckDismissAt = 0; DB.flatSince = 0;
    DB.visitStartAt = Date.now(); S.ckExpandOverride = false; S.mode = "walkup";
    DB.shadowExceptions = [];   // exception-lane rulings persist — a prior run's must not leak in
    /* CADENCE (Aug 11 2026): the touch schedule makes every horizon a function
       of the wall clock, which would make every allocator expectation below
       drift with the hour the suite happens to run. An EXPLICITLY EMPTY
       schedule is a real setting meaning "I keep no cadence", and it restores
       the single global horizon these fixtures were written against. The
       cadence block sets a real schedule and asserts against it. */
    DB.touchWindows = []; DB.fillHorizonH = 4;
    DB.strataStats = {}; DB.recipeLog = {}; DB.recipeFlags = [];   // prospecting ledgers are durable by design — a prior run's must not leak in either
    /* Sustained qualification: freeze streak upkeep (the suite controls
       DB.qual by hand) and pre-qualify the core fixture items so allocator
       tests exercise the allocator, not the seasoning clock. */
    S.qualStamp = S.latestAt + "|" + S.hourAt;
    const qualified = () => ({ n: 3, firstAt: Date.now() - 3 * 3600e3, lastAt: Date.now() - 3600e3 });
    DB.qual = { 9001: qualified(), 9002: qualified(), 9003: qualified() };

    const nowS = Math.floor(Date.now()/1000);
    const mkItem = (id, n) => {
      const it = { i:id, n, l:25000, m:0, v:0, a:0 };
      S.items.push(it); S.byId.set(id, it);
      S.latest[id] = { high:4400, low:4000, highTime: nowS-60, lowTime: nowS-120 };
      S.hour[id]  = { avgHighPrice:4400, avgLowPrice:4000, highPriceVolume:50000, lowPriceVolume:50000 };
      S.min5[id]  = { avgHighPrice:4400, avgLowPrice:3900, highPriceVolume:4000, lowPriceVolume:4000 };
      const pts = [], vols = [], series = [], byHour = new Array(24).fill(1000);
      for (let k = 0; k < 168; k++){ const mid = 4200 + ((k % 2) ? 1 : -1); pts.push(mid); vols.push(1000); series.push({t: nowS-(168-k)*3600, mid}); }
      S.spark.set(id, { at: Date.now(), pts, vols, byHour, series, noData:false });
    };
    mkItem(9001, "Probe alpha"); mkItem(9002, "Probe beta"); mkItem(9003, "Probe gamma");
    /* THE FIXTURE HONOURS PRODUCTION'S OWN INVARIANT (Aug 20 2026). `loadLatest`
       stamps `S.latestAt` exactly when it installs a usable price map, and from
       tonight that is the whole meaning of the field — "when we last had usable
       prices", not "when a fetch returned". A fixture that populates `S.latest`
       and leaves the stamp at 0 is a state production cannot be in, and it made
       `updateQualStreaks`' new live-data precondition read as a defect when it
       is the guard that stops an offline boot deleting the seasoning store.
       Two later blocks deliberately drive the stamp to 0 to exercise the
       never-fetched guard and restore it afterwards; both capture the value
       first, so they keep working. */
    S.latestAt = Date.now();
    DB.watch = [{id:9001, qty:null},{id:9002, qty:null},{id:9003, qty:null}];
    DB.clusters = [{ id:1, name:"probe-cluster", members:[9001,9002], capPct:null, story:"", src:"manual", confirmedAt: Date.now() }];

    const c1 = calc(9001);
    ok("fixture clears margin gates", !!c1 && c1.margin === 312 && c1.roi > 1.2, JSON.stringify(c1));

    // ---- allocator: cluster exposure cap ----
    const plan = buildPlan();
    const fundedIds = plan.picks.map(p => p.id);
    const inCl = plan.picks.filter(p => p.id === 9001 || p.id === 9002);
    ok("one cluster member funded", inCl.length === 1,
       JSON.stringify({fundedIds, bench: plan.bench.map(b => b.name + ": " + b.failed), next: plan.nextUp.map(n => n.name + ": " + n.why)}));
    ok("funded member cluster-clamped with note", inCl.length === 1 && inCl[0].allocQty === 4000
       && (inCl[0].sizeNotes || []).some(s => /^cluster cap: probe-cluster/.test(s)),
       inCl.length ? JSON.stringify({q: inCl[0].allocQty, notes: inCl[0].sizeNotes}) : "none funded");
    const blockedNU = plan.nextUp.find(n => n.id === 9001 || n.id === 9002);
    ok("other member NEXT UP with cluster reason", !!blockedNU && /^cluster cap: probe-cluster at limit/.test(blockedNU.why),
       blockedNU ? blockedNU.why : JSON.stringify(plan.nextUp.map(n => n.why)));
    const gamma = plan.picks.find(p => p.id === 9003);
    /* THE SIZING TERM, asserted directly (clamp-absorption rule, Aug 13 2026).
       Both size assertions here read CLAMPED outputs: 4000 is the cluster cap
       and 5000 is the per-item cap — measured, the horizon term computes 30,000
       for gamma, so neither figure can see a defect in the sizing that feeds
       them. They still test the clamps, which is worth testing; this tests the
       term the clamps hide. */
    /* ═══ THE HORIZON TERM, BY SCALING AND UNDER A REAL SCHEDULE ═══
       (adversarial pass, Aug 13 2026 — CONFIRMED after seven refutation attempts)
       This used to assert `planHorizonUnits(50000, 1e9) === Math.floor(50000 *
       GATE.capture * FILLH())` — the production body restated character for
       character, so the two sides moved together and the only defect it could
       catch was an edit the probe author forgot to mirror. In particular the
       M118 recurrence was invisible: swapping FILLH() for DB.fillHorizonH at
       the production line changes NOTHING here, because probe:65 sets
       `DB.touchWindows = []` and the two are the same 4 under an empty schedule.
       Three assertions replace it, none of which restates the formula:
       R72.1 scales — doubling the volume gate doubles the term, and doubling
       the HORIZON doubles it too, which is the dependence the copy could not
       see. R72.2 pins the clamp as wiring, separately. R72.3 does the same
       under a REAL four-window schedule, where FILLH() and DB.fillHorizonH are
       different numbers and the substitution is therefore observable. */
    ok("[R72.1] the horizon term SCALES with its inputs — asserted by proportion, never by restating the formula",
       (() => { const a = horizonUnitsFor(50000), b = horizonUnitsFor(100000);
                const keepFH = DB.fillHorizonH; DB.fillHorizonH = keepFH * 2;
                const c = horizonUnitsFor(50000); DB.fillHorizonH = keepFH;
                return a > 0 && Math.abs(b - 2 * a) <= 1 && Math.abs(c - 2 * a) <= 1; })(),
       JSON.stringify({ v: horizonUnitsFor(50000), v2: horizonUnitsFor(100000) }));
    ok("[R72.2] the call site CLAMPS the term to qty — asserted as wiring, apart from the term itself",
       planHorizonUnits(50000, 12) === 12 && planHorizonUnits(50000, 1e9) === horizonUnitsFor(50000),
       JSON.stringify({ clamped: planHorizonUnits(50000, 12), unclamped: planHorizonUnits(50000, 1e9) }));
    /* THE ONE THAT CATCHES M118. Under a real schedule FILLH() is the gap to
       the next touch and DB.fillHorizonH is the dormant fallback; they differ,
       so reading the wrong one changes the answer. Under the empty schedule
       this block otherwise runs on, they are identical and the defect hides. */
    ok("[R72.3] under a REAL schedule the term follows the SCHEDULE, not the dormant fallback constant",
       /* THE FALLBACK IS DERIVED FROM THE LIVE GAP, NOT PINNED AT 4 (fifth face,
          caught on this assertion's own first run). The gap to the next touch is
          a function of the wall clock and sweeps 0->9.5h, so it passes through 4
          several times a day: a fixed fallback of 4 made this pass or fail by the
          hour, and it failed its first run at gap = 3.97. Deriving the fallback
          from the gap makes the two distinguishable at EVERY instant, which is
          the ruling's "inject the varying input" rather than pinning the clock. */
       (() => { const kw = DB.touchWindows, kf = DB.fillHorizonH;
                DB.touchWindows = [7, 12, 17, 21.5];
                const gap = FILLH();
                DB.fillHorizonH = gap + 5;
                const viaSchedule = horizonUnitsFor(50000);
                const viaFallback = Math.floor(50000 * GATE.capture * DB.fillHorizonH);
                DB.touchWindows = kw; DB.fillHorizonH = kf;
                return gap > 0 && viaSchedule !== viaFallback; })(),
       JSON.stringify((() => { const kw = DB.touchWindows, kf = DB.fillHorizonH;
                DB.touchWindows = [7, 12, 17, 21.5];
                const gap = FILLH(); DB.fillHorizonH = gap + 5;
                const o = { scheduleGapH: Math.round(gap * 100) / 100, viaSchedule: horizonUnitsFor(50000),
                            fallbackH: Math.round((gap + 5) * 100) / 100,
                            viaFallback: Math.floor(50000 * GATE.capture * DB.fillHorizonH) };
                DB.touchWindows = kw; DB.fillHorizonH = kf; return o; })()));
    /* RENAMED Aug 13 2026 (label-claim scan, scan 14). This read "uncapped item
       funded full" — a false claim about its own subject. 5000 IS the per-item
       cap, and the horizon term for gamma computes 30000, so the item is
       neither uncapped nor funded full: the assertion is a CLAMP test, and a
       defect anywhere in the sizing term that feeds the cap leaves 5000
       unchanged. That is exactly why the term itself is asserted separately.
       No behaviour change — the test was always worth having, under its real
       name. An assertion label is copy, and copy claims what it computes. */
    ok("item outside the cluster cap lands at the PER-ITEM cap (a clamp test; the sizing term is asserted separately)",
       !!gamma && gamma.allocQty === 5000 && !(gamma.sizeNotes || []).some(s => /cluster/.test(s)),
       gamma ? JSON.stringify({q: gamma.allocQty, notes: gamma.sizeNotes}) : "gamma missing: " + JSON.stringify({fundedIds, bench: plan.bench.map(b => b.name + ": " + b.failed)}));

    // ---- exposure counts committed positions ----
    DB.positions = [{ id: 1, itemId: 9001, name:"Probe alpha", qty: 4000, buy: 4000, placedAt: Date.now() }];
    const plan2 = buildPlan();
    const nu2 = plan2.nextUp.find(n => n.id === 9002);
    ok("committed exposure blocks the cluster", !!nu2 && /^cluster cap: probe-cluster at limit/.test(nu2.why),
       nu2 ? nu2.why : JSON.stringify({picks: plan2.picks.map(p => p.id), next: plan2.nextUp.map(n => n.id + ":" + n.why)}));
    ok("exposure math", clusterExposure(DB.clusters[0]) === 16e6, String(clusterExposure(DB.clusters[0])));
    DB.positions = [];

    // ---- per-cluster P&L ----
    DB.flips = [{ id: Date.now(), itemId: 9001, name:"Probe alpha", qty: 10, buy: 4000, sell: 4400, date: today(), note:"" }];
    const expP = 10 * (4400 - 4000 - geTax(4400, 9001));
    ok("cluster P&L from log", clusterPnL(DB.clusters[0], 0) === expP, clusterPnL(DB.clusters[0], 0) + " vs " + expP);

    // ---- candidates: upsert / dedup / dismissal memory / confirmed-skip ----
    const cA = upsertCand([9001,9002,9003], { status:"suspected", src:"comove", story:"co-moves — reason unknown", evidence:{corr:0.7, days:25} });
    ok("upsert creates candidate", !!cA && DB.clusterCands.filter(x => x.sig === cA.sig).length === 1);
    const cB = upsertCand([9003,9002,9001], { status:"suspected", src:"comove", story:"co-moves — reason unknown", evidence:{corr:0.8, days:26} });
    ok("upsert dedups by sig, refreshes evidence", cB === cA && DB.clusterCands.filter(x => x.sig === cA.sig).length === 1 && cA.evidence.corr === 0.8);
    cA.status = "dismissed";
    upsertCand([9001,9002,9003], { status:"suspected", src:"comove", story:"co-moves — reason unknown", evidence:{corr:0.9, days:27} });
    ok("dismissed stays dismissed", cA.status === "dismissed" && DB.clusterCands.filter(x => x.sig === cA.sig).length === 1);

    // ---- seeded candidates resolve from mapping names ----
    for (const pair of [[8001,"Blood rune"],[8002,"Death rune"],[8003,"Soul rune"],[8004,"Water rune"]]){
      let have = false;
      for (const it of S.items) if (it.n === pair[1]) have = true;
      if (!have){ const it = { i:pair[0], n:pair[1], l:25000, m:0, v:0, a:0 }; S.items.push(it); S.byId.set(pair[0], it); }
    }
    DB.clSeedV1 = 0;
    seedClusterCands();
    const seeded = DB.clusterCands.find(x => x.name === "ancient-magicks-runes");
    ok("seed cluster proposed (seeded — unconfirmed)", !!seeded && seeded.status === "seeded" && seeded.members.length >= 3,
       JSON.stringify(DB.clusterCands.map(x => (x.name || x.story) + ":" + x.status)));

    // ---- ratification flows ----
    window.prompt = () => "probe-ratified";
    confirmCand(seeded.id);
    const rat = DB.clusters.find(cl => cl.name === "probe-ratified");
    ok("confirm activates cluster", !!rat && seeded.status === "confirmed" && rat.members.join() === seeded.members.join());
    ok("members of a confirmed cluster never re-flagged", upsertCand(rat.members.slice(), { status:"suspected", src:"comove", story:"x", evidence:{} }) === null);
    const dCand = upsertCand([9001,9003,8001], { status:"dormant", src:"wiki", story:"all: Probe cat — story without smoke (no co-movement yet)", evidence:{cat:"Probe cat"} });
    dismissCand(dCand.id);
    ok("dismiss silences candidate", dCand.status === "dismissed");

    // ---- renders ----
    S.tab = "watch"; renderWatch();
    const cluHTML = document.querySelector("#cluBody").innerHTML;
    ok("panel renders confirmed clusters", /probe-cluster/.test(cluHTML) && /probe-ratified/.test(cluHTML));
    S.wDetail = new Set([9001]); renderWatch();
    ok("watch row expand view shows the basket chip (tag consolidation moved it off the row)",
       /probe-cluster/.test(document.querySelector("#watchBody tr.wdet") ? document.querySelector("#watchBody tr.wdet").innerHTML : ""));
    S.wDetail = new Set(); renderWatch();
    S.tab = "routine"; S.mode = "weekly"; renderRoutine();
    /* Consolidation (user ruling, Aug 11 2026): the basket ledger and the
       SLEEVE section left the review — they are only meaningful when new
       intelligence lands, so they live on the Sleeve tab. Asserted by
       ABSENCE in the review plus PRESENCE on the tab that owns them: a cut
       that only checked the review would pass just as well if the machinery
       had been deleted outright. */
    ok("[R36.1] the basket ledger and the sleeve section left the weekly review",
       !/basket ledger/i.test(document.querySelector("#ckList").innerHTML)
       && !/data-slvhealth/.test(document.querySelector("#ckList").innerHTML)
       && !/gp per minute of attention/i.test(document.querySelector("#ckList").innerHTML),
       document.querySelector("#ckList").innerHTML.slice(0, 200));
    setTab("sleeve"); renderAll();
    ok("[R36.1] both still live on the Sleeve tab — the machinery moved, it was not deleted",
       /probe-cluster/.test(document.querySelector("#clusterPanel").innerHTML)
       && /Sleeve stats|No sleeve positions/.test(document.querySelector("#slvHealth").innerHTML),
       document.querySelector("#slvHealth").innerHTML.slice(0, 160));
    S.tab = "routine"; S.mode = "weekly"; renderRoutine();

    // ---- advisory pieces (day-independent) ----
    DB.positions = [{ id: 2, itemId: 9001, name:"Probe alpha", qty: 10, buy: 4000, placedAt: Date.now() }];
    const play = clustersInPlay([]);
    ok("clustersInPlay names members", play.some(x => x.cl.name === "probe-cluster" && x.names.indexOf("Probe alpha") >= 0),
       JSON.stringify(play.map(x => x.cl.name)));
    const wtxt = wedClusterAdvisoryText([]);
    ok("wed advisory fires only on Wednesdays", new Date().getDay() === 3 ? /probe-cluster/.test(wtxt) : wtxt === "", JSON.stringify(wtxt));

    // ═══ DISCOVERY AUDIT ═══
    const nowMs = Date.now(), day = 86400e3;
    DB.positions = []; DB.audRuled = {}; DB.decisionLog = []; DB.gateLog = [];
    DB.seedAt = { 9001: nowMs - 20 * day, 9010: nowMs - 20 * day };
    DB.sibBorn = { 9002: { seed: 9001, t: nowMs - 10 * day }, 9003: { seed: 9001, t: nowMs - 10 * day } };
    DB.flips = [
      { id: nowMs - 5 * day, itemId: 9001, name:"Probe alpha", qty: 10, buy: 4000, sell: 4400, date: today(), note:"" },
      { id: nowMs - 4 * day, itemId: 9002, name:"Probe beta",  qty: 10, buy: 4000, sell: 4400, date: today(), note:"" },
      { id: nowMs - 3 * day, itemId: 9003, name:"Probe gamma", qty: 10, buy: 4000, sell: 4400, date: today(), note:"" }
    ];
    DB.watch.push({ id: 9011, src: "scout", sib: 9010, sibAt: nowMs - 8 * day, addedAt: nowMs - 8 * day });
    DB.watch.push({ id: 9012, src: "scout", sib: 9010, sibAt: nowMs - 9 * day, addedAt: nowMs - 9 * day });

    const sAud = seedAudit();
    const aProm = sAud.find(x => x.id === 9001), aRet = sAud.find(x => x.id === 9010);
    ok("seed audit recommends PROMOTE at 3 trading members", !!aProm && aProm.rec === "PROMOTE" && aProm.trading === 3
       && aProm.lineageIds.length === 3, JSON.stringify(aProm));
    ok("seed audit recommends RETIRE when cold and flat", !!aRet && aRet.rec === "RETIRE" && aRet.ungrad === 2, JSON.stringify(aRet));

    const zAud = sibAudit();
    ok("zombie watcher flagged", zAud.rows.filter(r => r.zombie).length === 2 && zAud.total === 2,
       JSON.stringify(zAud.rows));

    // prune one zombie via the action path
    auditSibAction(9012, "confirm");
    ok("zombie prune removes watcher + logs", !DB.watch.some(w => w.id === 9012)
       && DB.decisionLog.some(x => x.kind === "sibling" && x.action === "prune")
       && !!DB.audRuled["sib:9012"], JSON.stringify(DB.decisionLog));

    // promote-to-thesis via the action path
    window.prompt = () => "probe-lineage";
    auditSeedAction(9001, "confirm");
    const promoted = DB.clusters.find(cl => cl.name === "probe-lineage");
    ok("PROMOTE confirm creates ratified cluster + logs", !!promoted && promoted.members.length === 3
       && DB.decisionLog.some(x => x.kind === "seed" && x.action === "promote-to-thesis")
       && DB.audRuled["seed:9001"] && DB.audRuled["seed:9001"].action === "promote",
       JSON.stringify({clusters: DB.clusters.map(c => c.name), log: DB.decisionLog}));

    // retire via the action path (prunes 9011, clears the seed)
    auditSeedAction(9010, "confirm");
    ok("RETIRE confirm prunes un-graduated siblings + clears seed", !DB.watch.some(w => w.id === 9011)
       && !(9010 in DB.seedAt) && DB.decisionLog.some(x => x.kind === "seed" && x.action === "retire"),
       JSON.stringify({watch: DB.watch.map(w => w.id), seedAt: DB.seedAt}));

    // gate health: override bucket (flip dated a still-benched day) vs
    // latency bucket (flip after the gate stopped benching) — never conflated
    const yd = new Date(nowMs - day).toLocaleDateString("en-CA");
    DB.flips = [
      { id: nowMs - day,     itemId: 9002, name:"Probe beta",  qty: 10, buy: 4000, sell: 4400, date: yd,      note:"" },
      { id: nowMs - 3600e3,  itemId: 9004, name:"Probe delta", qty: 10, buy: 4000, sell: 4400, date: today(), note:"" },
      { id: nowMs - 1800e3,  itemId: 9003, name:"Probe gamma", qty: 10, buy: 4000, sell: 4400, date: today(), note:"" }
    ];
    DB.gateLog = [{ d: yd, id: 9002, g: "trend" }, { d: yd, id: 9004, g: "trend" }, { d: yd, id: 9003, g: "funded" }];
    const gh = gateHealthAudit();
    const tr = gh.rows.find(r => r.g === "trend");
    ok("gate health: override vs latency buckets", !!tr && tr.benched === 2
       && tr.ovrTraded === 1 && tr.ovrNet === 3120      // 9002 flip dated yd = a day trend was benching it
       && tr.latTraded === 1 && tr.latNet === 3120      // 9004 flip dated today, no bench row today
       && gh.fundedCount === 1 && gh.fundedNet === 3120, JSON.stringify(gh));
    const ghHTML = gateStreamsSection();   // pure renderer — asserting it must not mutate the fixture
    ok("gate health copy labels both buckets", /traded while still benched/.test(ghHTML)
       && /traded after unbenching/.test(ghHTML) && !/possibly too tight/.test(ghHTML), ghHTML.slice(0, 600));

    // buildPlan writes the gate ledger
    buildPlan();
    ok("plan writes gate ledger", DB.gateLog.some(e => e.g === "funded" && e.d === today()),
       JSON.stringify(DB.gateLog.slice(-6)));

    // audit renders in the weekly review
    S.tab = "routine"; S.mode = "weekly"; renderRoutine();
    const ckHTML = document.querySelector("#ckList").innerHTML;
    ok("weekly review renders the audit", /Seed audit/.test(ckHTML) && /Sibling audit/.test(ckHTML)
       && /Cluster queue/.test(ckHTML) && /Gate health/.test(ckHTML) && /Decision log/.test(ckHTML));
    ok("ruled cards rest", /rests a week/.test(ckHTML));

    // ═══ POSITION QTY CORRECTIONS (friction, Aug 9 2026 — mixed hide cape) ═══

         8 — UNREACHABLE: the gate constants forbid it → not never-fed, not inert

    S.latest[9002] = { high: 4300, low: 4000, highTime: Math.floor(Date.now() / 1000), lowTime: Math.floor(Date.now() / 1000) };
    shadowTick();
    const p44 = DB.shadowBook[0];
    ok("[R44.2] a buy leg that never reaches qty inside its horizon resolves PARTIAL, not a silently shrunk trip",
       p44.state === "partial" && p44.qty === 100000 && p44.forced === 100000 - p44.buyQ
       && Number.isFinite(p44.net),
       JSON.stringify({ state: p44.state, qty: p44.qty, bought: p44.buyQ, forced: p44.forced }));

       JSON.stringify({ s: p44.strictFilled, l: p44.lenientFilled }));
    DB.shadowBook = keep44; S.min5At = keepAt44; S.pollSeq = keepSeq44;

    // ---- R44.3 the headline is a rate with a distribution, per cohort ----
    const keep44b = DB.shadowBook, keepBank44 = DB.bank, keepRes44 = DB.reserve, keepSh44 = DB.shadowReserve;
    const t0 = Date.now() - 4 * 3600e3;
    const mk44 = (i, net, qty, st) => ({ id: 44100 + i, fam: "e" + i, itemId: 9001, name: "Probe alpha",
      qty, bid: 1000, ask: 1100, t: t0, closedAt: t0 + 3600e3, hzH: 4, obsMs: 4 * 3600e3,
      state: st || "filled", net, regimes: [], slice: i > 1 ? 1 : 0, stratum: i > 1 ? "f2p" : null });
    DB.shadowBook = [mk44(0, 1000, 100), mk44(1, 100000, 100), mk44(2, 50, 100), mk44(3, 50, 100)];
    const eco = paperEconomics(paperClosed());
    ok("[R44.3] the headline is a RATE — net per gp-day of simulated notional, not a total",
       eco.gpDays > 0 && Math.abs(eco.rate - eco.net / eco.gpDays) < 1e-12
       && /per gp-day of simulated notional/.test(paperRateFace(paperClosed())),
       JSON.stringify({ net: eco.net, gpDays: Math.round(eco.gpDays), rate: eco.rate }));
    ok("[R44.3] distribution rides beside it — median trip, top-5 share, and the outcome census",
       eco.median === 525 && eco.top5Share > 0.9 && eco.outcomes.filled === 4,
       JSON.stringify({ median: eco.median, top5: eco.top5Share, outcomes: eco.outcomes }));
    const hs = paperHeadlineSection();
    ok("[R44.3] net renders PER COHORT and is never blended into one number",
       /never blended/.test(hs) && /data-drill="paper:econ"/.test(hs)

    /* Capital feasibility. The fixture deliberately mixes overlapping and

    DB.bank = 100000; DB.reserve = 0; DB.shadowReserve = 0;
    const seqA = Object.assign(mk44(4, 10, 100), { t: t0 + 2 * 3600e3, closedAt: t0 + 3 * 3600e3 });
    const seqB = Object.assign(mk44(5, 10, 100), { t: t0 + 3 * 3600e3, closedAt: t0 + 4 * 3600e3 });
    DB.shadowBook = [mk44(0, 1000, 100), mk44(1, 100000, 100), seqA, seqB];
    const pk44 = paperPeakNotional(paperClosed());

       pk44.peak === 200000, JSON.stringify(pk44));
    DB.shadowBook = [mk44(0, 1000, 100), mk44(1, 100000, 100), mk44(2, 50, 100), mk44(3, 50, 100)];
    ok("[R44.3] and it is flagged when the sim assumed more capital than exists",
       /Capital feasibility/.test(paperHeadlineSection())

       /did not spend money that is not there/.test(paperHeadlineSection()),

    ok("[R44.4] the raw summed net survives ONLY in the regime comparison, labelled comparison-only",
       /* The load-bearing half stays VISIBLE after the noise edit; the
          mechanics moved behind a tap, so the tap's text is asserted too —
          a caveat whose tap does not reach its full text is the stranding
          this edit is most likely to produce. */
       /Comparison only, not a magnitude/.test(paperRegimeSection())
       && /only the DIFFERENCE between these sums carries information/.test(paperRegimeSection())
       && /the level cancels out/.test(paperRegimeSection()),
       "regime comparison label");
    DB.shadowBook = keep44b; DB.bank = keepBank44; DB.reserve = keepRes44; DB.shadowReserve = keepSh44;
  } catch(e){
    out.push("FAIL reachability / rate-not-total :: " + (e && e.stack || e));
  }

  // ─── §45: AMBIGUOUS-BY-TOUCH, AND FILL-MODEL CALIBRATION ───
  try {
    const capT2 = v => Math.max(1, Math.floor(v * GATE.capture));
    // ---- R45.1 the widened ambiguous class ----
    const noTouch = reachCredit(4100, 4000, 100, "buy", false);
    const touched = reachCredit(4100, 4000, 100, "buy", true);
    ok("[R45.1] bucket average on the wrong side and NO touch observed = no credit at all",
       !noTouch.any && noTouch.strict === 0 && noTouch.oper === 0 && noTouch.lenient === 0,
       JSON.stringify(noTouch));
    ok("[R45.1] wrong side but a live instabuy TOUCHED my price inside the bucket = ambiguous, haircut only",
       touched.any && touched.at === true && touched.strict === 0
       && touched.oper === Math.max(1, Math.floor(capT2(100) * shadowPart()))
       && touched.lenient === capT2(100),
       JSON.stringify(touched));
    ok("[R45.1] a touch never upgrades a PROVEN print — strictly past my price is already full credit",
       (() => { const a = reachCredit(3900, 4000, 100, "buy", true), b = reachCredit(3900, 4000, 100, "buy", false);
                return a.strict === b.strict && a.oper === b.oper && a.beyond && b.beyond; })(),
       "touch is only a floor-raiser for the ambiguous case");
    /* The whole point of the widening: the old rule fired on exact equality
       only, which a 5-minute AVERAGE almost never hits. */
    ok("[R45.1] the widened class actually fires where the old one did not",
       !reachCredit(4100, 4000, 100, "buy", false).any
       && reachCredit(4100, 4000, 100, "buy", true).any,
       "same bucket, opposite verdicts, decided by the touch");
    // ---- R45.2 reconstruction cannot produce the ambiguous class ----
    const pts45 = [];
    const base45 = Date.now() - 3600e3;
    for (let i = 0; i < 12; i++) pts45.push({ t: base45 + i * 300e3, lo: 4100, hi: 4000, lv: 9000, hv: 9000 });
    const recon45 = { id: 45001, itemId: 9001, qty: 10, bid: 4001, ask: 4399, t: base45, hzH: 1,
      buyQ: 0, sellQ: 0, buyQFull: 0, sellQFull: 0, buyDone: 0, state: "open" };
    reconReplay(recon45, pts45, base45, Date.now());
    ok("[R45.2] a reconstructed span gets NO ambiguous credit — the touch history does not exist to be read",
       recon45.buyQ === 0 && recon45.buyQFull === 0,
       JSON.stringify({ buyQ: recon45.buyQ, full: recon45.buyQFull }));
    ok("[R45.2] and the trip is STAMPED, so a reconstructed fill rate is never read beside a live one in silence",
       recon45.reachLimited === 1, JSON.stringify({ stamped: recon45.reachLimited }));
    ok("[R45.2] reconstruction still credits PROVEN prints normally — the limit is the ambiguous class, not the model",
       (() => { const r2 = { id: 45002, itemId: 9001, qty: 10, bid: 4200, ask: 9e9, t: base45, hzH: 1,
                  buyQ: 0, sellQ: 0, buyQFull: 0, sellQFull: 0, buyDone: 0, state: "open" };
                reconReplay(r2, pts45, base45, Date.now());
                return r2.buyQ === 10 && r2.reachLimited === 1; })(),
       "proven still credits under reconstruction");

    // ---- R45.3 calibration replays REAL flips and reports its own limits ----
    /* Both legs PROVEN: the tape's low (4100) sits strictly below the bid and
       its high (4000) strictly above the ask, so neither bound needs the
       ambiguous class a replay cannot supply. */
    const f45 = { f: { itemId: 9001, name: "Probe alpha", qty: 10, buy: 4200, sell: 3900, bh: 0.5 },
      buyAt: base45, sellAt: base45 + 1800e3 };
    const c45 = calibReplayOne(f45, pts45);
    ok("[R45.3] a flip the model can complete reads AGREED on both bounds",
       c45.strict.verdict === "filled" && c45.lenient.verdict === "filled",
       JSON.stringify({ s: c45.strict, l: c45.lenient }));
    ok("[R45.3] a leg that only ever traded AT the price reads worse on the proven bound than the possible one",
       (() => { const atAsk = { f: { itemId: 9001, name: "Probe alpha", qty: 10, buy: 4200, sell: 4000, bh: 0.5 },
                  buyAt: base45, sellAt: base45 + 1800e3 };
                const r = calibReplayOne(atAsk, pts45);
                return r.strict.verdict === "forced-exit" && r.lenient.verdict === "filled"; })(),
       "the bracket separates where the tape only touched");
    const f45b = { f: { itemId: 9001, name: "Probe alpha", qty: 999999, buy: 4200, sell: 4000, bh: 0.5 },
      buyAt: base45, sellAt: base45 + 1800e3 };
    const c45b = calibReplayOne(f45b, pts45);
    ok("[R45.3] a flip the model cannot complete reads FALSE PARTIAL or FALSE NEVER, with how wrong it was",
       ["partial", "unfilled"].indexOf(c45b.strict.verdict) >= 0
       && Number.isFinite(c45b.strict.buyPct) && c45b.strict.buyPct < 100,
       JSON.stringify(c45b.strict));
    const f45c = { f: { itemId: 9001, name: "Probe alpha", qty: 10, buy: 3000, sell: 4000, bh: 0.5 },
      buyAt: base45, sellAt: base45 + 1800e3 };
    ok("[R45.3] a bid the tape never reached reads FALSE NEVER — the damning verdict is reachable",
       calibReplayOne(f45c, pts45).strict.verdict === "unfilled",
       JSON.stringify(calibReplayOne(f45c, pts45).strict));
    ok("[R45.3] the panel states its three limits rather than working around them",
       (() => { const keepC = DB.calib; DB.calib = null;
                const s = calibSection(); DB.calib = keepC;
                return /ROLLING test/.test(s) && /36-hour retention/.test(s)
                    && /only ever measurable[\s\S]*going forward/.test(s); })(),
       calibSection().slice(0, 300));
    ok("[R45.3] and it refuses the 1h substitution in writing, with the reason",
       (() => { const keepC = DB.calib;
                DB.calib = { at: Date.now(), rows: [], total: 5, retentionH: CALIB_5M_RETENTION_H,
                  skipped: { tooOld: 4, noWindow: 1, noTape: 0 },
                  strict: { agree: 0, falsePartial: 0, falseNever: 0, falseForced: 0, agreePct: null, medianBuyShortfallPct: null },
                  lenient: { agree: 0, falsePartial: 0, falseNever: 0, falseForced: 0, agreePct: null, medianBuyShortfallPct: null } };
                const s = calibSection(); DB.calib = keepC;
                return /NOT replayed against 1h buckets/.test(s) && /twelve times the volume/.test(s)
                    && /4 outside/.test(s) && /1 with no recorded buy duration/.test(s); })(),
       "1h refusal + skip census");
  } catch(e){
    out.push("FAIL ambiguous-by-touch / calibration :: " + (e && e.stack || e));
  }

  // ─── §46: CALIBRATION WINDOW ANCHOR, TRACE, DURATION SPLIT ───
  try {
    /* The defect the first calibration run exposed: the log moment is the end
       of the ROUND TRIP, so the buy window opens at logAt - (sh + bh), not
       logAt - bh. Anchoring it at logAt - bh placed every replay later by the
       whole sell-leg duration. Reproduced here at both leg lengths, because
       the misplacement is a fixed offset and that is exactly why it looked
       like a duration effect. */
    const bkt46 = t => Math.floor(t / 300e3) * 300e3;
    const logAt46 = bkt46(Date.now());
    /* Tape: cheap (reachable) during the true BUY window, expensive after it.
       A correctly anchored replay fills; one shifted by sh sees only the
       expensive half and credits nothing at all. */
    const mkTape = (buyStart, buyEnd) => {
      const pts = [];
      for (let t = buyStart - 3600e3; t <= logAt46 + 3600e3; t += 300e3)
        pts.push({ t, lo: (t >= buyStart && t <= buyEnd) ? 900 : 1200, hi: 1500, lv: 100000, hv: 100000 });
      return pts;
    };
    /* The window comes from PRODUCTION (calibWindow), never re-derived here —
       a probe that computes the anchor itself passes with the harness bug
       fully intact, which is exactly how the first version of this shipped
       and exactly the case law this repo already carries. The "wrong" object
       reproduces the OLD anchor deliberately, as the defect to contrast. */
    const mkFlip = (bh, sh) => {
      const f = { id: logAt46, itemId: 9001, name: "Probe alpha", qty: 10, buy: 1000, sell: 1400, bh, sh };
      const w = calibWindow(f, logAt46 + 60e3);
      return { f, e: w,
               wrong: { f, bh, sh, buyAt: logAt46 - bh * 3600e3, sellAt: logAt46 },
               pts: mkTape(w.buyAt, w.buyDoneReal) };
    };
    const fast = mkFlip(0.383, 1.25);     // 23-minute buy, median 1.25h sell
    const slow = mkFlip(6, 1.25);         // 6-hour buy, same sell
    ok("[R46.1] correctly anchored, a fast leg that really completed replays as FILLED",
       calibReplayOne(fast.e, fast.pts).lenient.verdict === "filled",
       JSON.stringify(calibReplayOne(fast.e, fast.pts).lenient));
    const wrongFast = calibReplayOne(fast.wrong, fast.pts);
    ok("[R46.1] anchored at logAt-bh instead, the same fast leg credits ZERO — not partial, zero",
       wrongFast.lenient.verdict === "unfilled" && wrongFast.lenient.buyPct === 0,
       JSON.stringify(wrongFast.lenient));
    ok("[R46.1] the SAME misplacement barely touches a slow leg — which is why it read as a duration effect",
       calibReplayOne(slow.wrong, slow.pts).lenient.verdict === "filled"
       && calibReplayOne(slow.e, slow.pts).lenient.verdict === "filled",
       JSON.stringify({ wrong: calibReplayOne(slow.wrong, slow.pts).lenient.verdict }));
    /* Through calibWindow itself, so the anchor arithmetic is asserted where
       it actually lives. */
    ok("[R46.1] the window opens at logAt-(sh+bh) and the buy ends at logAt-sh — anchored to the trip, not the log",
       (() => { const w = calibWindow({ id: logAt46, bh: 2, sh: 1 }, logAt46 + 60e3);
                return w.ok && w.buyAt === logAt46 - 3 * 3600e3 && w.buyDoneReal === logAt46 - 1 * 3600e3; })(),
       JSON.stringify(calibWindow({ id: logAt46, bh: 2, sh: 1 }, logAt46 + 60e3)));
    ok("[R46.1] both leg timings are REQUIRED — a flip without sh cannot be located and is skipped, not guessed",
       calibWindow({ id: logAt46, bh: 0.5 }, logAt46 + 60e3).reason === "noWindow"
       && calibWindow({ id: logAt46, bh: 0.5, sh: 0 }, logAt46 + 60e3).ok === true,
       "sh required, and sh=0 is a real value rather than a missing one");
    /* ═══ R69.1–2 A RECORDED ZERO IS NOT A MISSING VALUE ═══
       (falsy-zero census, Aug 13 2026 — CONFIRMED, and live in real data)
       `!(bh > 0)` sent a buy duration of ZERO down the `noWindow` path, whose
       copy and export both describe the bucket as flips that "lacked a
       recorded buy or sell leg duration". Two of the fifty logged flips carry
       `bh: 0`, so the claim was false about real rows. The writer produces it
       routinely — any buy filling inside ~18s rounds to 0.
       Seeds: restore `!(bh > 0)` → 69.1 alone (the copy still carries its
       clause and the export still carries its key); delete the copy clause →
       69.2 alone (calibWindow is untouched). */
    ok("[R69.1] a buy duration of ZERO skips as instantBuy, a MISSING one as noWindow — and null is missing, not zero",
       calibWindow({ id: logAt46, bh: 0, sh: 1 }, logAt46 + 60e3).reason === "instantBuy"
       && calibWindow({ id: logAt46, sh: 1 }, logAt46 + 60e3).reason === "noWindow"
       && calibWindow({ id: logAt46, bh: null, sh: 1 }, logAt46 + 60e3).reason === "noWindow"
       && calibWindow({ id: logAt46, bh: 2, sh: 1 }, logAt46 + 60e3).ok === true,
       JSON.stringify({ zero: calibWindow({ id: logAt46, bh: 0, sh: 1 }, logAt46 + 60e3).reason,
                        missing: calibWindow({ id: logAt46, sh: 1 }, logAt46 + 60e3).reason,
                        nul: calibWindow({ id: logAt46, bh: null, sh: 1 }, logAt46 + 60e3).reason }));
    ok("[R69.2] the skip copy names the real cause, and must NOT call a recorded zero a missing duration",
       /* Same shape [R45.3]'s skip-census fixture uses — strict/lenient are
          required by calibSection and omitting them threw a TypeError that
          aborted the whole try block, taking R46.2 and R46.3 down with it. */
       (() => { const keepC69 = DB.calib;
                const z = { agree: 0, falsePartial: 0, falseNever: 0, falseForced: 0,
                            agreePct: null, medianBuyShortfallPct: null };
                DB.calib = { at: Date.now(), rows: [], total: 2, retentionH: CALIB_5M_RETENTION_H,
                             skipped: { tooOld: 0, noWindow: 0, noTape: 0, instantBuy: 2 },
                             strict: z, lenient: z };
                /* try/finally, not a bare restore: the first version of this
                   fixture omitted strict/lenient, calibSection threw BEFORE
                   the restore line, and the broken calib was then PERSISTED
                   into the probe's Edge profile — so the next run could not
                   even load the app. A fixture that mutates persisted state
                   must put it back on the throwing path too. */
                let s; try { s = calibSection(); } finally { DB.calib = keepC69; save(); }
                return /buy duration IS recorded and is zero/.test(s)
                    && /2 whose buy duration IS recorded/.test(s)
                    && !/2 with no recorded buy duration/.test(s); })(),
       "instantBuy=2 must read as recorded-and-zero, never as no-recorded-duration");
    ok("[R46.1] a flip outside the 5m retention window is skipped as tooOld, not replayed on stale tape",
       calibWindow({ id: logAt46 - 40 * 3600e3, bh: 1, sh: 1 }, logAt46).reason === "tooOld",
       "retention guard");

    // ---- R46.2 the bucket trace explains a zero down to the bucket ----
    const tr = wrongFast.trace;
    ok("[R46.2] a zero-credit leg carries a bucket-by-bucket trace, not just a verdict",
       Array.isArray(tr) && tr.length > 0 && tr.every(x => x.why && Number.isFinite(x.credited)),
       JSON.stringify(tr.slice(0, 2)));
    ok("[R46.2] and each bucket says WHY it contributed nothing, naming the two prices",
       tr.every(x => x.credited === 0) && tr.some(x => /sat ABOVE the fill price/.test(x.why)),
       JSON.stringify(tr[0]));
    ok("[R46.2] a reaching bucket is distinguishable from a non-reaching one in the same trace",
       (() => { const t2 = calibReplayOne(fast.e, fast.pts).trace;
                return t2.some(x => x.credited > 0 && /proven reach/.test(x.why)); })(),
       "reaching buckets labelled");
    ok("[R46.2] the row carries the reach census so the zero is visible before opening the trace",
       wrongFast.bucketsInWindow > 0 && wrongFast.bucketsReaching === 0
       && calibReplayOne(fast.e, fast.pts).bucketsReaching > 0,
       JSON.stringify({ inWindow: wrongFast.bucketsInWindow, reaching: wrongFast.bucketsReaching }));

    // ---- R46.3 the duration split renders every run ----
    const rows46 = [calibReplayOne(fast.wrong, fast.pts), calibReplayOne(slow.wrong, slow.pts)];
    /* Through the production summariser, so the split cannot be dropped from
       the result without this failing. */
    const sum46 = calibSummarise(rows46);
    const sp = sum46.lenient.byDuration;
    ok("[R46.3] the summary always carries the split, and separates legs by their own duration",
       !!sp && sp.fast.n === 1 && sp.slow.n === 1 && sp.fast.falseNever === 1 && sp.slow.agree === 1
       && !!sum46.strict.byDuration,
       JSON.stringify(sp));
    ok("[R46.3] and it renders on every run, with the bounded-defect reading called out when it skews",
       (() => { const keepC = DB.calib;
                DB.calib = { at: Date.now(), rows: rows46, total: 2, retentionH: CALIB_5M_RETENTION_H,
                  skipped: { tooOld: 0, noWindow: 0, noTape: 0 },
                  strict: sum46.strict, lenient: sum46.lenient };
                const s = calibSection(); DB.calib = keepC;
                return /By buy-leg duration/.test(s) && /under 1h/.test(s) && /1h and over/.test(s)
                    && /bounded defect/.test(s) && /hold duration constant/.test(s); })(),
       "duration split renders with its reading");
  } catch(e){
    out.push("FAIL calibration anchor / trace / split :: " + (e && e.stack || e));
  }

  // ─── §47: CALIBRATION EXPORT — the measurement leaves, the log does not ───
  try {
    const keepCal = DB.calib, keepBank47 = DB.bank;
    /* A fixture carrying EVERY class the export must exclude, with distinctive
       values so a leak is findable by search rather than by inspection. */
    const MAGIC = { bid: 987654, ask: 1234567, net: 555555555, bank: 777777777, at: 1700000000000 };
    DB.bank = MAGIC.bank;
    const mkRow47 = (n, bh, sh, verdict, traceN) => ({
      item: "Probe alpha", itemId: 9001, qty: 4242,
      bid: MAGIC.bid, ask: MAGIC.ask, netGp: MAGIC.net,
      buyAt: MAGIC.at, sellAt: MAGIC.at + n * 3600e3, bh, sh, fastLeg: bh < 1 ? 1 : 0,
      bucketsInWindow: traceN, bucketsReaching: 0,
      strict: { verdict, buyPct: 0, sellPct: 0 },
      lenient: { verdict, buyPct: 0, sellPct: 0 },
      trace: Array.from({ length: traceN }, (_, i) => ({
        t: MAGIC.at + i * 300e3, minsIn: i * 5,
        lo: MAGIC.bid + 1000, lv: 900, credited: 0, code: "above-price",
        why: "average low " + MAGIC.bid + 1000 + " sat ABOVE the fill price " + MAGIC.bid + " — never reached" })) });
    /* The long-trace flip is the NEWEST, so the 12-flip cap keeps it and the
       head/tail trim is actually exercised. */
    const rows47 = [mkRow47(99, 0.4, 1.25, "unfilled", 70)];
    for (let i = 0; i < 15; i++) rows47.push(mkRow47(i + 2, 6, 1, "filled", 4));
    DB.calib = Object.assign({ at: Date.now(), rows: rows47, total: 40, retentionH: CALIB_5M_RETENTION_H,
      skipped: { tooOld: 21, noWindow: 3, noTape: 0 } }, calibSummarise(rows47));
    const X = analysisCalibration();
    const blob = JSON.stringify(X);

    // ---- R47.1 the measurement and its evidence are all present ----
    ok("[R47.1] both bound summaries carry all five fields",
       ["agreedFilled", "falsePartial", "falseForcedExit", "falseNeverFilled", "medianBuyCreditedWhenWrongPct"]
         .every(k => k in X.calibration.provenReachBound && k in X.calibration.possibleReachBound),
       JSON.stringify(X.calibration.provenReachBound));
    ok("[R47.1] per-flip rows carry the durations, both verdicts and the reach census",
       X.replayedFlips.length > 0 && X.replayedFlips.every(f => f.item && f.qty
         && Number.isFinite(f.realBuyDurationHours) && Number.isFinite(f.realSellDurationHours)
         && f.verdictProvenReach && f.verdictPossibleReach
         && Number.isFinite(f.bucketsReachingThePrice) && Number.isFinite(f.bucketsInWindow)),
       JSON.stringify(X.replayedFlips[0] && X.replayedFlips[0].item));
    ok("[R47.1] the bucket trace carries time, relative price, volume, credit and a reason",
       X.replayedFlips[0].trace.every(b => Number.isFinite(b.minutesFromWindowStart)
         && "bucketAvgLowVsFillPct" in b && Number.isFinite(b.lowSideVolume)

  try {

       !pB.picks.some(p => p.id === 9901)
       && pB.bench.some(b => b.id === 9901 && /blacklisted by you/.test(b.failed || "")),

    const rdyThin = seriesReadiness({ pts: Array.from({ length: 20 }, (_, i) => i), vols: new Array(60).fill(1) });
    const rdyNoVol = seriesReadiness({ pts: Array.from({ length: 30 }, (_, i) => i), vols: new Array(10).fill(1) });
    ok("[R99.3] readiness is PER CONSUMER and the four minima differ — 3 / 5 / 24 / 48. A 20-point series feeds trend and momentum and starves DRIFT, which is precisely the state the old mask called ready because it keyed on trend alone",
       rdyFull.allFed === true
       && rdyThin.trend === true && rdyThin.momentum === true && rdyThin.drift === false && rdyThin.allFed === false
       && rdyNoVol.drift === true && rdyNoVol.volTrend === false && rdyNoVol.allFed === false,
       JSON.stringify({ full: rdyFull.allFed, thin: rdyThin, noVol: rdyNoVol.allFed }));
    ok("[R99.3] and NaN price points are not counted as fed — the archive pushes NaN for an hour with no print on either side, so an unfiltered length would call a starved series ready",
       seriesReadiness({ pts: [1, 2, NaN, NaN, NaN, NaN], vols: [] }).momentum === false
       && seriesReadiness({ pts: [1, 2, NaN, NaN, NaN, NaN], vols: [] }).pts === 2,
       JSON.stringify(seriesReadiness({ pts: [1, 2, NaN, NaN, NaN, NaN], vols: [] })));
    /* AND THE CHAIN USES IT — asserted at the CONSUMER, not the term. The

       the mask to `tr == null` left it green: exactly the defect the re-pass

    DB.blacklist = []; DB.shadowExceptions = [];
    const thinCd = candidateFor({ id: 9901, qty: null });
    S.spark.set(9901, { at: Date.now(), pts: Array.from({ length: 168 }, () => 4200),
                        vols: Array.from({ length: 168 }, () => 1000),
                        byHour: new Array(24).fill(1000), series: [], noData: false });
    const fullCd = candidateFor({ id: 9901, qty: null });
    ok("[R99.3] and the CHAIN benches on it: a 20-point series — trend and momentum fed, DRIFT starved — benches 'chart still loading', while a 168-point one does not. Asserted at the consumer, because asserting the term left a revert to the old tr-only mask green",

  /* ═══ §100 — THE HOUR WEIGHT: ROUTED, THIRD-STATED, AND HELD OUT ═══════

     chart-derived reading still off the resolver, and its absence value was
     `{ w: 1 }` — the same number a MEASURED balanced item produces, entering

     project acquired the same day, MISTAKES M159): `candidateFor` for the

     CLOCK-INDEPENDENT — a peaked profile would give a w that depends on the

     and restored by value, S.items is spliced back to its original LENGTH, and
     every id is in the 993x range no other block uses.

  try {

    };

    /* A SECOND held item with a FATTER core, so the held block's stated sort has

    DB.t1Budget = 100e6; DB.t2Budget = 50e6;

    /* THE LABEL SAYS WHAT THIS PINS, AND WHAT IT CANNOT (adversarial pass, Aug

    let persisted105 = 0;
    const v105 = validateImport({ watch: [{ id: 9981, qty: null, src: "manual", addedAt: 1 }] });
    applyImport(v105, () => { persisted105++; });
    ok("[R105.1] a whole-state restore PERSISTS, and the persist step is reached from the restore itself rather than left to whatever the app happens to do next. `flush()` alone was a no-op: it returns early on `if (!dirty) return true;` and `dirty` is set in exactly one place, inside `save()`, which `Object.assign(DB, v.db)` does not call. So on a tab with nothing pending the restore lived in memory and survived only if some later unrelated save happened to fire — the same import persisting or vanishing depending on what else ran that minute, which is a race rather than a clean failure",
       persisted105 === 1 && DB.watch.some(w => w.id === 9981),
       JSON.stringify({ persistCalls: persisted105, applied: DB.watch.some(w => w.id === 9981) }));

    /* And the production default really is save-then-flush, not flush alone —
       asserted on the function's own text because the default argument is not
       observable from outside it. This is a source read and says so. */
    const aiSrc = applyImport.toString().replace(/\/\*[\s\S]*?\*\//g, " ");
    ok("[R105.2] and the DEFAULT persist step — the one production uses, since the handler passes no second argument — is `save()` before `flush()`, not `flush()` alone. Read off the function's own text, because a default parameter is not observable from outside the call. If this ever reads `flush()` on its own again, the restore goes back to depending on whatever the app did next",
       /save\(\)\s*;\s*flush\(\)/.test(aiSrc) && !/\(\s*\)\s*=>\s*\{\s*flush\(\)\s*;?\s*\}/.test(aiSrc),
       aiSrc.slice(aiSrc.indexOf("persist ||"), aiSrc.indexOf("persist ||") + 60));

    DB.watch = k105.watch; DB.flips = k105.flips; DB.positions = k105.positions;

    /* 2. THE RECORD-LEVEL SOURCE TIER, in `importIntelligence` — three lines
          from the two the previous pass repaired, and missed because that
          repair grepped for the exact expression rather than for the property.
          ASSERTED AT THE ADMISSION GATE, which is the branch that spends the
          coercion: a catalyst record needs `sourceTier != null && sourceTier
          <= 1`, so a null tier reading as 0 lets through a record the code
          says must be rejected.
          THE FIRST FORM OF THIS ASSERTION WAS POINTED AT THE WRONG FUNCTION.
          It called `validateImport`, whose intel branch had already been fixed
          in the previous sweep, so seed S171b reverted the real defect and the
          suite stayed GREEN. The seed is what found it; the assertion had run,
          on real production code, and proved a property that was true for a
          reason unrelated to the fix it was written for. */
    const kIntel105 = DB.intel.slice();
    const catRec = tier => ({ records: [{ id: "probe-105-cat", type: "catalyst",
      confidence: "confirmed", title: "t", thesis: "th", sourceTier: tier,
      items: [9981], validUntil: "2026-12-31",
      sources: [{ url: "https://example.invalid/x", note: "" }],
      catalyst: { name: "c", windowStart: "2026-09-01", windowEnd: "2026-09-30" } }] });
    DB.intel = [];
    const rNull = importIntelligence(catRec(null));
    DB.intel = [];
    const rZero = importIntelligence(catRec(0));
    DB.intel = kIntel105;
    ok("[R105.3] a RECORD-level null source tier does not read as tier 0, asserted at the gate that spends it: a catalyst whose citations carry no tier and whose record-level tier is NULL is REJECTED, while the same record claiming a real tier 0 is admitted. `+null` is 0 and tier 0 is the most authoritative class, so an unrated record was passing the T0/T1 primary requirement that exists to stop exactly that. This is the third bare unary plus in the family and it sat three lines below one the previous repair fixed — that repair searched for `includes(+s.tier)` instead of for the property, which is the error it was written to correct",
       rNull.tierRejected === 1 && rNull.added === 0
       && rZero.tierRejected === 0 && rZero.added === 1,
       JSON.stringify({ nulled: { rejected: rNull.tierRejected, added: rNull.added },
                        realZero: { rejected: rZero.tierRejected, added: rZero.added } }));

    /* 3. THE QUANTITY BOX. Live, with no import involved: `clampNum("", 0)` is
          0, so clearing the box wrote a manual size of ZERO.
          DRIVEN THROUGH THE REAL BRANCH, not a copy of its arithmetic. The
          handler is delegated on `document`, so a `[data-qty]` input dispatching
          a bubbling `change` reaches production's own writer — which is the
          difference between testing the product and testing my transcription of
          it (the seventh face, and the reason `[R102.1]`'s first form did not
          bite). */
    const kW105 = DB.watch.slice();
    DB.watch = [{ id: 9982, qty: 250 }, { id: 9983, qty: null }];
    const box105 = document.createElement("input");
    box105.type = "number";
    box105.setAttribute("data-qty", "9982");
    document.body.appendChild(box105);
    const fire105 = v => { box105.value = v; box105.dispatchEvent(new Event("change", { bubbles: true })); };
    fire105("");
    const clearedTo = DB.watch[0].qty;
    fire105("250");
    const typedTo = DB.watch[0].qty;
    fire105("0");
    const zeroTo = DB.watch[0].qty;
    box105.remove();
    const c105 = { buy: 1000, sell: 1100, limit: 100, name: "Probe onezerofive" };
    DB.watch[0].qty = clearedTo;
    ok("[R105.4] clearing the quantity box CLEARS the override rather than setting a size of zero — driven through production's own delegated change handler, and a typed number still sets one. `clampNum(\"\", 0)` is 0 because `+\"\"` is 0 and 0 is finite, so an emptied box wrote a manual size of zero onto the row: `opsPick` returned 0 because 0 is not null, `planQty`'s `wanted` became 0, and the item benched on `sizing` with a reason blaming working capital or a missing buy limit, neither of which had happened. A typed `0` clears too, because it is indistinguishable from an empty box through `clampNum` and there is no reading in which funding exactly zero units is a thing to ask for. The correct pattern sat twelve lines above it in the same handler, on `h.paid` — the third time that has been true of this defect",
       clearedTo === null && typedTo === 250 && zeroTo === null,
       JSON.stringify({ emptied: clearedTo, typed: typedTo, typedZero: zeroTo }));
    /* THE MANUAL ARM MUST BE DRIVEN THROUGH `DB.watch`, NOT THROUGH THE
       ARGUMENT. `planQty(w, c)` resolves the size with `opsOf(w.id).qty`,
       which looks the row up in `DB.watch` — so passing `{ id, qty: 50 }`
       tests nothing: the lookup ignores the object and finds the stored row.
       The first form did exactly that and read 100 in both arms. */
    DB.watch[0].qty = 50;
    const manual105 = planQty(DB.watch[0], c105);
    DB.watch[0].qty = clearedTo;
    const auto105 = planQty(DB.watch[0], c105);
    ok("[R105.5] and the CONSUMER separates them: the cleared row sizes automatically off the cap with `auto: true`, while a typed 50 stays 50. `planQty` is where the field becomes a funded quantity, and a cleared override must land in the automatic branch rather than the manual one. TWO fixture corrections are recorded in the source here, both of which made the first forms read the same number in both arms: the manual value is 50 rather than 250 because the cap is 100 and `Math.min(wanted, cap)` was pinning both arms, and the manual arm is driven by writing `DB.watch`, because `planQty` resolves the size through `opsOf(w.id)` and ignores the object it is handed",
       auto105.auto === true && auto105.qty === 100
       && manual105.qty === 50 && manual105.auto === false,
       JSON.stringify({ auto: auto105, manual: manual105 }));
    DB.watch = kW105;

  } catch(e){
    out.push("FAIL pass-6 fixes :: " + (e && e.stack || e));
  }

  /* ═══ §108 — THE PRE-FLIP FIX LIST (user ruling, Aug 20 2026) ═════════════
     Six fixes ruled the night before the cutover, in the order they were
     ruled. Every assertion here is anchored at the BRANCH that consumes the
     term, not at the term beside it — the rule three consecutive passes
     earned. Sections 106 and 107 are deliberately skipped and reserved for
     the staged repairs that did NOT land tonight. */
  try {
    const k108 = { watch: DB.watch.slice(), qual: JSON.parse(JSON.stringify(DB.qual)),
                   flips: DB.flips.slice(), ops: JSON.parse(JSON.stringify(DB.itemOps || {})),
                   v1: DB.itemOpsV1, v2: DB.itemOpsV2, stamp: S.qualStamp, at: S.latestAt,
                   gl: DB.gateLog.slice(), tw: DB.touchWindows.slice() };

    /* ── 1. AN UNEVALUATED CYCLE NEITHER BREAKS A STREAK NOR CREDITS ONE.
          Driven through `updateQualStreaks` itself, with the two rows differing
          on exactly the term under test: both carry `failed`, one carries
          `noEval` and the other a real gate verdict. If the fixture gave them
          the same shape it would be measuring nothing. */
    DB.watch = [{ id: 9001, qty: null }];
    DB.qual = { 9001: { n: 2, firstAt: Date.now() - 6e5, lastAt: Date.now() - 6e5 },
                9002: { n: 2, firstAt: Date.now() - 6e5, lastAt: Date.now() - 6e5 } };
    S.qualStamp = null;
    updateQualStreaks([{ id: 9001, failed: "no live price in /latest", noEval: 1 },
                       { id: 9002, failed: "ROI floor — 0.4% under the 1.2% floor" }]);
    ok("[R108.1] a candidate that could not be EVALUATED keeps its seasoning streak, and one a gate actually DECLINED loses it — both rows carry `failed` and the only difference between them is the `noEval` stamp, so the assertion cannot pass by accident. This is the money half of pass 8's finding 4.1: with a price feed that answered but carried no rows, every watch item came back `failed` for lack of anything to read and the loop spent that as a gate verdict, deleting the whole book's tenure and sending it back to the qualifying queue for a calendar day",
       !!DB.qual[9001] && DB.qual[9001].n === 2 && DB.qual[9002] === undefined,
       JSON.stringify({ unevaluated: DB.qual[9001], gateFailed: DB.qual[9002] }));

    /* ── 2. AND THE GATE LEDGER DOES NOT RECORD A DAY THE GATE NEVER RAN.
          The second reader of the same term. `gateName("no live price in
          /latest")` is null, so an unevaluated row was logging as a bench by
          "plan gate" — gate-persistence evidence about an edge nothing
          measured. */
    /* Item 9998 is not in `S.byId`, so `calc` returns null and `candidateFor`
       takes its no-price return — the same shape an empty payload produces for
       a real item, reached without touching the shared price fixture. */
    DB.watch = [{ id: 9998, qty: null }];
    DB.gateLog = []; DB.qual = {}; S.qualStamp = null;
    const P108 = buildPlan();
    const loggedUneval = DB.gateLog.filter(e => e.id === 9998).length;
    const benchedUneval = (P108.bench || []).filter(b => b.id === 9998).length;
    ok("[R108.2] an unevaluated row still BENCHES with its reason on screen, and writes NO gate-ledger row — the second reader of the same term. `gateName(\"no live price in /latest\")` is null, so this was logging as a bench by \"plan gate\": gate-persistence evidence about an edge that nothing measured, feeding the 4-of-7-days bar that moves gate constants. The observed-day stamp is still written unconditionally, because the day WAS observed — this item just was not readable in it",
       benchedUneval === 1 && loggedUneval === 0,
       JSON.stringify({ benched: benchedUneval, gateLogRows: loggedUneval }));

    /* ── 3. THE SEASONING LOOP DOES NOT RUN AT ALL WITHOUT LIVE DATA.
          The offline-boot half of 4.1, and a different branch from the one
          above: this is the precondition, not the per-row test. */
    DB.qual = { 9001: { n: 3, firstAt: Date.now() - 6e5, lastAt: Date.now() - 6e5 } };
    S.qualStamp = null; S.latestAt = 0;
    updateQualStreaks([{ id: 9001, failed: "no live price in /latest", noEval: 1 }]);
    const survivedOffline = !!DB.qual[9001] && DB.qual[9001].n === 3;
    S.latestAt = k108.at;
    ok("[R108.3] with no usable prices ever received this session, the seasoning loop returns before touching anything — the live-data precondition its siblings `scorerCycle` and `stampDeployLog` both have and it did not. At boot `S.latestAt` is 0 and `S.qualStamp` is unset, so the stamp `\"0|0\"` differed from `undefined` and the guard PASSED: a first refresh that failed deleted every streak in the book and saved. The stamp guard could never have caught it, because it exists to stop a second pass on the same data rather than a first pass on none",
       survivedOffline, JSON.stringify({ afterOfflinePass: DB.qual[9001] }));

    /* ── 4. THE SEASONING WAIVER READS THE TRADE'S DATE, NOT THE LOG INSTANT.
          Discriminating by construction: both rows are logged NOW and differ
          only in `date`. Under the old `f.id >= cut` test both waived. */
    const oldD = new Date(Date.now() - 90 * 86400e3).toLocaleDateString("en-CA");
    const newD = new Date(Date.now() - 3 * 86400e3).toLocaleDateString("en-CA");
    DB.flips = [{ id: Date.now(), itemId: 9001, qty: 1, buy: 1, sell: 2, date: oldD },
                { id: Date.now(), itemId: 9002, qty: 1, buy: 1, sell: 2, date: newD }];
    ok("[R108.4] the seasoning waiver reads the TRADE's date and not the moment the row was typed in — a flip logged today but dated ninety days ago no longer waives the gate, while one dated three days ago still does. Both fixture rows carry `id: Date.now()`, so the old `f.id >= cut` test waived BOTH and this fixture is what separates them. The ordinary route needs no import: `#lDate` is a plain editable date input, and everyday log-lag does it in weaker form; the import edge stamps every id-less row with the import instant and waived a whole foreign history at once",
       qualExemption(9001, null) === null && /logged round trip/.test(qualExemption(9002, null) || ""),
       JSON.stringify({ backDated: qualExemption(9001, null), recent: qualExemption(9002, null) }));
    ok("[R108.4] and a row whose date is missing or malformed waives NOTHING — absence may not lift a restraint, so it is skipped rather than falling back to `f.id`, which is the defect",
       (() => { DB.flips = [{ id: Date.now(), itemId: 9003, qty: 1, buy: 1, sell: 2 },
                            { id: Date.now(), itemId: 9004, qty: 1, buy: 1, sell: 2, date: "not-a-date" }];
                return qualExemption(9003, null) === null && qualExemption(9004, null) === null; })(),
       "absent and malformed dates both grant nothing");
    DB.flips = k108.flips;

    /* ── 5. THE PLACEMENT STAMP HAS A FLOOR, AND THE CONSUMER IS THE SELL
          LADDER. Asserted at `sellAgeInfo`, the branch that turns the stamp
          into an UNDERCUT & EXIT instruction, never at the stamp alone. */
    /* THE FIXTURE HAS TO PRODUCE A SUB-HOUR GAP OR IT TESTS NOTHING, and the
       first form of it did not: with `DB.touchWindows = []` the schedule is off
       and `gapHoursAt` returns `Math.max(1, DB.fillHorizonH || 4)` = 4, so the
       floor was present and NOT BINDING and removing it changed no output. The
       seed came back green and that was the finding, not a pass.
       A touch four minutes out is derived from the clock rather than pinned to
       one, so the assertion holds at every hour of the day; `rawGap < 1` is
       carried as a CONJUNCT so a fixture that stops producing the sub-hour case
       goes red instead of passing vacuously. */
    const dNow = new Date();
    const hNow = dNow.getHours() + dNow.getMinutes() / 60 + dNow.getSeconds() / 3600;
    /* TWO windows, not one: `touchWindows()` returns `TOUCH_DEFAULT` for any
       array shorter than 2, so a single-element fixture silently became the
       real four-touch schedule and produced a 3.1h gap. The second window is
       twelve hours out so the next touch is unambiguously the near one. */
    DB.touchWindows = [(hNow + 4 / 60) % 24, (hNow + 12) % 24];
    const rawGap = gapHoursAt(Date.now());
    const floorH = placementHzH();
    const nearTouch = { id: 1, itemId: 9001, qty: 1, buy: 100, ask: 120, placedAt: Date.now() - 10 * 60e3,
                        stage: "selling", hzH: placementHzH() };
    const rung = sellAgeInfo(nearTouch);
    ok("[R108.5] a leg placed minutes before a touch is not told to UNDERCUT & EXIT minutes later — `placementHzH` floors at one hour, asserted at `sellAgeInfo`, the branch that renders the instruction. `gapHoursAt`'s own one-hour floor was deliberately removed on Aug 13 2026 because a nominal imminent touch was pricing SIZING against an hour; a stamp is a different consumer, because it is FROZEN onto a record and never re-derived. Unfloored, a repair logged at 11:56 against a 12:00 touch reached rung 2 in eight minutes and gave up the whole quoted spread. The floor also restores what the repair path had before it was stamped at all, since `legHorizonH`'s fallback is itself `Math.max(1, …)`",
       rawGap < 1 && floorH === 1 && rung === null,
       JSON.stringify({ unflooredGapH: rawGap, stamp: floorH, tenMinutesOld: rung }));
    DB.touchWindows = k108.tw;

    /* ── 6. THE OPERATOR WRITE PATH PUTS THE VALUE WHERE BOTH REGIMES LOOK.
          Driven with the flag OFF, which is the shipped regime and the one the
          defect lived in: the press must reach the store as well, or the flip
          discards it. */
    DB.watch = [{ id: 9001, qty: null }];
    DB.itemOps = {}; DB.itemOpsV1 = 1; DB.itemOpsV2 = 1;
    opsWrite(9001, { tierOv: 0 }, false);
    const rowSide = DB.watch[0].tierOv, storeSide = (DB.itemOps[9001] || {}).tierOv;
    ok("[R108.6] a press with the item store OFF writes the ROW and MIRRORS into the store, so arming `ITEM_OPS` later cannot discard it — `ITEM_OPS` is a read-side switch, not a write-side one. The first form of this repair branched, which closed the gap at the reconciliation boot and re-opened it on the very next press: from then until the flip every press landed on the row alone while the snapshot aged, and `opsPick` prefers the store for any key the store owns. The fixture uses `tierOv: 0` on purpose — untiered is a BENCH the operator applied, and the pre-repair failure mode was that bench silently lifting with no press",
       rowSide === 0 && storeSide === 0,
       JSON.stringify({ row: rowSide, store: storeSide }));
    ok("[R108.6] and `opsOf` reads back the same value on BOTH sides of the flag, which is what makes the flip a no-op for a value the operator set tonight",
       opsOf(9001, false).tierOvRaw === 0 && opsOf(9001, true).tierOvRaw === 0,
       JSON.stringify({ off: opsOf(9001, false).tierOvRaw, on: opsOf(9001, true).tierOvRaw }));

    /* ── 7. THE FLAG-PAIRING GUARD, AND THE TERM IT GOVERNS READING THE SAME
          FLAG. The second half is pass 8 finding 3.1: the guard decided the
          5m-streak question off the injected set while `vol5Population` decided
          it off the const, so a test could be told a combination was legal and
          run the armed path in exactly the state the guard refuses. */
    ok("[R108.7] arming the candidate pool while the 5-minute die-off streak still counts the watchlist only is REFUSED, and the plan falls back to the watchlist — a pool item is not a watch row, so its streak is NOT COUNTED rather than zero, `volGateFor` falls through to the 1h branch, and the 5m binding is a `Math.min` that can only ever SHRINK a size. Pool items would be sized LARGER than an identically-placed pin in a book whose 5m flow has died, and they are the population with no operator history behind them",
       typeof cutoverFault({ pool: true, ops: true, vol5: false }) === "string"
       && cutoverFault({ pool: true, ops: true, vol5: true }) === null
       && cutoverPoolOn({ pool: true, ops: true, vol5: false }) === false
       && cutoverPoolOn({ pool: true, ops: true, vol5: true }) === true,
       JSON.stringify({ refused: cutoverFault({ pool: true, ops: true, vol5: false }),
                        legal: cutoverFault({ pool: true, ops: true, vol5: true }) }));
    ok("[R108.7] and `vol5Population` — the code that ACTUALLY decides the streak's population — reads the same flag the guard reads, so the legal combination is legal in the machinery and not only in the guard's opinion. Before this, the guard read `s.vol5` off the injected set while the population read the const, so every exercise of the armed pool path ran in precisely the state the guard exists to refuse: the refused state wearing the legal state's clothes",
       vol5Population(true).length === S.items.length
       && vol5Population(false).length === DB.watch.length
       && vol5Population(true).length !== vol5Population(false).length,
       JSON.stringify({ universe: vol5Population(true).length, watch: vol5Population(false).length }));

    DB.watch = k108.watch; DB.qual = k108.qual; DB.flips = k108.flips;
    DB.itemOps = k108.ops; DB.itemOpsV1 = k108.v1; DB.itemOpsV2 = k108.v2;
    S.qualStamp = k108.stamp; S.latestAt = k108.at; DB.gateLog = k108.gl; DB.touchWindows = k108.tw;
  } catch(e){
    out.push("FAIL pre-flip fix list :: " + (e && e.stack || e));
  }

  /* ═══ REQUIREMENTS cross-reference (REQUIREMENTS.md) ═══
     Derived from [R#] tags in assertion names; a requirement is FAIL if any
     tagged assertion failed. Lines are prefixed REQ so the fail counter
     never double-counts them. */
  const reqStatus = new Map();
  for (const line of out){
    const st = line.indexOf("PASS ") === 0 ? "PASS" : line.indexOf("FAIL ") === 0 ? "FAIL" : null;
    if (!st) continue;
    for (const rq of (line.match(/R\d+\.\d+[a-z]?/g) || []))
      reqStatus.set(rq, reqStatus.get(rq) === "FAIL" ? "FAIL" : st);
  }
  if (reqStatus.size){
    out.push("===REQS=== (cross-reference REQUIREMENTS.md)");
    for (const [rq, st] of [...reqStatus.entries()].sort((a, b) => a[0].localeCompare(b[0], undefined, { numeric: true })))
      out.push("REQ " + st + " " + rq);
    out.push("REQ coverage: " + reqStatus.size + " requirement ids asserted");
  }
  const fails = out.filter(l => l.indexOf("FAIL") === 0);
  document.title = fails.length ? "PROBE-FAIL " + fails.length : "PROBE-PASS";
  const pre = document.createElement("pre");
  pre.id = "probeOut";
  pre.textContent = "===PROBE===\n" + out.join("\n") + "\n===END===";
  document.body.appendChild(pre);
  try {
    fetch("http://127.0.0.1:8347/report", { method: "POST", mode: "no-cors",
      headers: { "Content-Type": "text/plain" }, body: document.title + "\n" + pre.textContent });
  } catch(e){}
})();
</script>
