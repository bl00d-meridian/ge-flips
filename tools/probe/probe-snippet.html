<script>
(async function(){
  const out = [];
  const ok = (name, cond, extra) => out.push((cond ? "PASS " : "FAIL ") + name + (cond ? "" : " :: " + (extra || "")));
  try {
    window.prompt = () => null; window.confirm = () => true;

    // ---- pure unit tests ----
    ok("pearson +1", Math.abs(pearson([1,2,3,4],[2,4,6,8]) - 1) < 1e-9);
    ok("pearson -1", Math.abs(pearson([1,2,3,4],[8,6,4,2]) + 1) < 1e-9);
    ok("pearson flat null", pearson([1,1,1,1],[1,2,3,4]) === null);
    const dr = dailyRetMap([{d:"2026-08-01",mid:100},{d:"2026-08-02",mid:110},{d:"2026-08-04",mid:121}]);
    ok("dailyRetMap consecutive only", dr.size === 1 && Math.abs(dr.get("2026-08-02") - 0.1) < 1e-9, JSON.stringify([...dr]));
    ok("cluSig sorted", cluSig([5,2,9]) === "2,5,9");

    // ---- clean fixture state ----
    DB.flips = []; DB.positions = []; DB.invLots = []; DB.watch = [];
    DB.clusters = []; DB.clusterCands = []; DB.blacklist = [];
    DB.scoutOn = false; DB.planPriority = []; DB.planDemoted = [];
    DB.bank = 500e6; DB.bankAsOf = Date.now(); DB.shadowReserve = 300e6;
    DB.reserve = 3e6; DB.t1Budget = 100e6; DB.t2Budget = 50e6; DB.slots = 7;
    DB.minExpectGp = 0; DB.clusterCapPct = 8; DB.lastCoScanAt = Date.now();
    DB.touchLog = [{d: today(), m: "walkup", t: Date.now()}];
    /* Sustained qualification: freeze streak upkeep (the suite controls
       DB.qual by hand) and pre-qualify the core fixture items so allocator
       tests exercise the allocator, not the seasoning clock. */
    S.qualStamp = S.latestAt + "|" + S.hourAt;
    const qualified = () => ({ n: 3, firstAt: Date.now() - 3 * 3600e3, lastAt: Date.now() - 3600e3 });
    DB.qual = { 9001: qualified(), 9002: qualified(), 9003: qualified() };

    const nowS = Math.floor(Date.now()/1000);
    const mkItem = (id, n) => {
      const it = { i:id, n, l:25000, m:0, v:0, a:0 };
      S.items.push(it); S.byId.set(id, it);
      S.latest[id] = { high:4400, low:4000, highTime: nowS-60, lowTime: nowS-120 };
      S.hour[id]  = { avgHighPrice:4400, avgLowPrice:4000, highPriceVolume:50000, lowPriceVolume:50000 };
      S.min5[id]  = { highPriceVolume:4000, lowPriceVolume:4000 };
      const pts = [], vols = [], series = [], byHour = new Array(24).fill(1000);
      for (let k = 0; k < 168; k++){ const mid = 4200 + ((k % 2) ? 1 : -1); pts.push(mid); vols.push(1000); series.push({t: nowS-(168-k)*3600, mid}); }
      S.spark.set(id, { at: Date.now(), pts, vols, byHour, series, noData:false });
    };
    mkItem(9001, "Probe alpha"); mkItem(9002, "Probe beta"); mkItem(9003, "Probe gamma");
    DB.watch = [{id:9001, qty:null},{id:9002, qty:null},{id:9003, qty:null}];
    DB.clusters = [{ id:1, name:"probe-cluster", members:[9001,9002], capPct:null, story:"", src:"manual", confirmedAt: Date.now() }];

    const c1 = calc(9001);
    ok("fixture clears margin gates", !!c1 && c1.margin === 312 && c1.roi > 1.2, JSON.stringify(c1));

    // ---- allocator: cluster exposure cap ----
    const plan = buildPlan();
    const fundedIds = plan.picks.map(p => p.id);
    const inCl = plan.picks.filter(p => p.id === 9001 || p.id === 9002);
    ok("one cluster member funded", inCl.length === 1,
       JSON.stringify({fundedIds, bench: plan.bench.map(b => b.name + ": " + b.failed), next: plan.nextUp.map(n => n.name + ": " + n.why)}));
    ok("funded member cluster-clamped with note", inCl.length === 1 && inCl[0].allocQty === 4000
       && (inCl[0].sizeNotes || []).some(s => /^cluster cap: probe-cluster/.test(s)),
       inCl.length ? JSON.stringify({q: inCl[0].allocQty, notes: inCl[0].sizeNotes}) : "none funded");
    const blockedNU = plan.nextUp.find(n => n.id === 9001 || n.id === 9002);
    ok("other member NEXT UP with cluster reason", !!blockedNU && /^cluster cap: probe-cluster at limit/.test(blockedNU.why),
       blockedNU ? blockedNU.why : JSON.stringify(plan.nextUp.map(n => n.why)));
    const gamma = plan.picks.find(p => p.id === 9003);
    ok("uncapped item funded full", !!gamma && gamma.allocQty === 5000 && !(gamma.sizeNotes || []).some(s => /cluster/.test(s)),
       gamma ? JSON.stringify({q: gamma.allocQty, notes: gamma.sizeNotes}) : "gamma missing: " + JSON.stringify({fundedIds, bench: plan.bench.map(b => b.name + ": " + b.failed)}));

    // ---- exposure counts committed positions ----
    DB.positions = [{ id: 1, itemId: 9001, name:"Probe alpha", qty: 4000, buy: 4000, placedAt: Date.now() }];
    const plan2 = buildPlan();
    const nu2 = plan2.nextUp.find(n => n.id === 9002);
    ok("committed exposure blocks the cluster", !!nu2 && /^cluster cap: probe-cluster at limit/.test(nu2.why),
       nu2 ? nu2.why : JSON.stringify({picks: plan2.picks.map(p => p.id), next: plan2.nextUp.map(n => n.id + ":" + n.why)}));
    ok("exposure math", clusterExposure(DB.clusters[0]) === 16e6, String(clusterExposure(DB.clusters[0])));
    DB.positions = [];

    // ---- per-cluster P&L ----
    DB.flips = [{ id: Date.now(), itemId: 9001, name:"Probe alpha", qty: 10, buy: 4000, sell: 4400, date: today(), note:"" }];
    const expP = 10 * (4400 - 4000 - geTax(4400, 9001));
    ok("cluster P&L from log", clusterPnL(DB.clusters[0], 0) === expP, clusterPnL(DB.clusters[0], 0) + " vs " + expP);

    // ---- candidates: upsert / dedup / dismissal memory / confirmed-skip ----
    const cA = upsertCand([9001,9002,9003], { status:"suspected", src:"comove", story:"co-moves — reason unknown", evidence:{corr:0.7, days:25} });
    ok("upsert creates candidate", !!cA && DB.clusterCands.filter(x => x.sig === cA.sig).length === 1);
    const cB = upsertCand([9003,9002,9001], { status:"suspected", src:"comove", story:"co-moves — reason unknown", evidence:{corr:0.8, days:26} });
    ok("upsert dedups by sig, refreshes evidence", cB === cA && DB.clusterCands.filter(x => x.sig === cA.sig).length === 1 && cA.evidence.corr === 0.8);
    cA.status = "dismissed";
    upsertCand([9001,9002,9003], { status:"suspected", src:"comove", story:"co-moves — reason unknown", evidence:{corr:0.9, days:27} });
    ok("dismissed stays dismissed", cA.status === "dismissed" && DB.clusterCands.filter(x => x.sig === cA.sig).length === 1);

    // ---- seeded candidates resolve from mapping names ----
    for (const pair of [[8001,"Blood rune"],[8002,"Death rune"],[8003,"Soul rune"],[8004,"Water rune"]]){
      let have = false;
      for (const it of S.items) if (it.n === pair[1]) have = true;
      if (!have){ const it = { i:pair[0], n:pair[1], l:25000, m:0, v:0, a:0 }; S.items.push(it); S.byId.set(pair[0], it); }
    }
    DB.clSeedV1 = 0;
    seedClusterCands();
    const seeded = DB.clusterCands.find(x => x.name === "ancient-magicks-runes");
    ok("seed cluster proposed (seeded — unconfirmed)", !!seeded && seeded.status === "seeded" && seeded.members.length >= 3,
       JSON.stringify(DB.clusterCands.map(x => (x.name || x.story) + ":" + x.status)));

    // ---- ratification flows ----
    window.prompt = () => "probe-ratified";
    confirmCand(seeded.id);
    const rat = DB.clusters.find(cl => cl.name === "probe-ratified");
    ok("confirm activates cluster", !!rat && seeded.status === "confirmed" && rat.members.join() === seeded.members.join());
    ok("members of a confirmed cluster never re-flagged", upsertCand(rat.members.slice(), { status:"suspected", src:"comove", story:"x", evidence:{} }) === null);
    const dCand = upsertCand([9001,9003,8001], { status:"dormant", src:"wiki", story:"all: Probe cat — story without smoke (no co-movement yet)", evidence:{cat:"Probe cat"} });
    dismissCand(dCand.id);
    ok("dismiss silences candidate", dCand.status === "dismissed");

    // ---- renders ----
    S.tab = "watch"; renderWatch();
    const cluHTML = document.querySelector("#cluBody").innerHTML;
    ok("panel renders confirmed clusters", /probe-cluster/.test(cluHTML) && /probe-ratified/.test(cluHTML));
    ok("watch row shows cluster badge", /probe-cluster<\/span>/.test(document.querySelector("#watchBody").innerHTML));
    S.tab = "routine"; S.mode = "weekly"; renderRoutine();
    ok("weekly review has cluster ledger", /cluster ledger/i.test(document.querySelector("#ckList").innerHTML)
       && /probe-cluster/.test(document.querySelector("#ckList").innerHTML));

    // ---- advisory pieces (day-independent) ----
    DB.positions = [{ id: 2, itemId: 9001, name:"Probe alpha", qty: 10, buy: 4000, placedAt: Date.now() }];
    const play = clustersInPlay([]);
    ok("clustersInPlay names members", play.some(x => x.cl.name === "probe-cluster" && x.names.indexOf("Probe alpha") >= 0),
       JSON.stringify(play.map(x => x.cl.name)));
    const wtxt = wedClusterAdvisoryText([]);
    ok("wed advisory fires only on Wednesdays", new Date().getDay() === 3 ? /probe-cluster/.test(wtxt) : wtxt === "", JSON.stringify(wtxt));

    // ═══ DISCOVERY AUDIT ═══
    const nowMs = Date.now(), day = 86400e3;
    DB.positions = []; DB.audRuled = {}; DB.decisionLog = []; DB.gateLog = [];
    DB.seedAt = { 9001: nowMs - 20 * day, 9010: nowMs - 20 * day };
    DB.sibBorn = { 9002: { seed: 9001, t: nowMs - 10 * day }, 9003: { seed: 9001, t: nowMs - 10 * day } };
    DB.flips = [
      { id: nowMs - 5 * day, itemId: 9001, name:"Probe alpha", qty: 10, buy: 4000, sell: 4400, date: today(), note:"" },
      { id: nowMs - 4 * day, itemId: 9002, name:"Probe beta",  qty: 10, buy: 4000, sell: 4400, date: today(), note:"" },
      { id: nowMs - 3 * day, itemId: 9003, name:"Probe gamma", qty: 10, buy: 4000, sell: 4400, date: today(), note:"" }
    ];
    DB.watch.push({ id: 9011, src: "scout", sib: 9010, sibAt: nowMs - 8 * day, addedAt: nowMs - 8 * day });
    DB.watch.push({ id: 9012, src: "scout", sib: 9010, sibAt: nowMs - 9 * day, addedAt: nowMs - 9 * day });

    const sAud = seedAudit();
    const aProm = sAud.find(x => x.id === 9001), aRet = sAud.find(x => x.id === 9010);
    ok("seed audit recommends PROMOTE at 3 trading members", !!aProm && aProm.rec === "PROMOTE" && aProm.trading === 3
       && aProm.lineageIds.length === 3, JSON.stringify(aProm));
    ok("seed audit recommends RETIRE when cold and flat", !!aRet && aRet.rec === "RETIRE" && aRet.ungrad === 2, JSON.stringify(aRet));

    const zAud = sibAudit();
    ok("zombie watcher flagged", zAud.rows.filter(r => r.zombie).length === 2 && zAud.total === 2,
       JSON.stringify(zAud.rows));

    // prune one zombie via the action path
    auditSibAction(9012, "confirm");
    ok("zombie prune removes watcher + logs", !DB.watch.some(w => w.id === 9012)
       && DB.decisionLog.some(x => x.kind === "sibling" && x.action === "prune")
       && !!DB.audRuled["sib:9012"], JSON.stringify(DB.decisionLog));

    // promote-to-thesis via the action path
    window.prompt = () => "probe-lineage";
    auditSeedAction(9001, "confirm");
    const promoted = DB.clusters.find(cl => cl.name === "probe-lineage");
    ok("PROMOTE confirm creates ratified cluster + logs", !!promoted && promoted.members.length === 3
       && DB.decisionLog.some(x => x.kind === "seed" && x.action === "promote-to-thesis")
       && DB.audRuled["seed:9001"] && DB.audRuled["seed:9001"].action === "promote",
       JSON.stringify({clusters: DB.clusters.map(c => c.name), log: DB.decisionLog}));

    // retire via the action path (prunes 9011, clears the seed)
    auditSeedAction(9010, "confirm");
    ok("RETIRE confirm prunes un-graduated siblings + clears seed", !DB.watch.some(w => w.id === 9011)
       && !(9010 in DB.seedAt) && DB.decisionLog.some(x => x.kind === "seed" && x.action === "retire"),
       JSON.stringify({watch: DB.watch.map(w => w.id), seedAt: DB.seedAt}));

    // gate health: override bucket (flip dated a still-benched day) vs
    // latency bucket (flip after the gate stopped benching) — never conflated
    const yd = new Date(nowMs - day).toLocaleDateString("en-CA");
    DB.flips = [
      { id: nowMs - day,     itemId: 9002, name:"Probe beta",  qty: 10, buy: 4000, sell: 4400, date: yd,      note:"" },
      { id: nowMs - 3600e3,  itemId: 9004, name:"Probe delta", qty: 10, buy: 4000, sell: 4400, date: today(), note:"" },
      { id: nowMs - 1800e3,  itemId: 9003, name:"Probe gamma", qty: 10, buy: 4000, sell: 4400, date: today(), note:"" }
    ];
    DB.gateLog = [{ d: yd, id: 9002, g: "trend" }, { d: yd, id: 9004, g: "trend" }, { d: yd, id: 9003, g: "funded" }];
    const gh = gateHealthAudit();
    const tr = gh.rows.find(r => r.g === "trend");
    ok("gate health: override vs latency buckets", !!tr && tr.benched === 2
       && tr.ovrTraded === 1 && tr.ovrNet === 3120      // 9002 flip dated yd = a day trend was benching it
       && tr.latTraded === 1 && tr.latNet === 3120      // 9004 flip dated today, no bench row today
       && gh.fundedCount === 1 && gh.fundedNet === 3120, JSON.stringify(gh));
    S.tab = "routine"; S.mode = "weekly"; renderRoutine();
    const ghHTML = document.querySelector("#ckList").innerHTML;
    ok("gate health copy labels both buckets", /traded while still benched/.test(ghHTML)
       && /traded after unbenching/.test(ghHTML) && !/possibly too tight/.test(ghHTML));

    // buildPlan writes the gate ledger
    buildPlan();
    ok("plan writes gate ledger", DB.gateLog.some(e => e.g === "funded" && e.d === today()),
       JSON.stringify(DB.gateLog.slice(-6)));

    // audit renders in the weekly review
    S.tab = "routine"; S.mode = "weekly"; renderRoutine();
    const ckHTML = document.querySelector("#ckList").innerHTML;
    ok("weekly review renders the audit", /Seed audit/.test(ckHTML) && /Sibling audit/.test(ckHTML)
       && /Cluster queue/.test(ckHTML) && /Gate health/.test(ckHTML) && /Decision log/.test(ckHTML));
    ok("ruled cards rest", /rests a week/.test(ckHTML));

    // ═══ POSITION QTY CORRECTIONS (friction, Aug 9 2026 — mixed hide cape) ═══
    const promptQ = [];
    window.prompt = () => promptQ.shift();
    window.confirm = () => true;   // keep remainder standing
    DB.positions = [{ id: 501, itemId: 9002, name: "Probe beta", qty: 23, buy: 27000, placedAt: nowMs - 3600e3, stage: "bought", stageAt: nowMs }];
    promptQ.push("18");
    partialPosition(501);
    const fixed = DB.positions.find(p => p.id === 501);
    const rem = DB.positions.find(p => p.id !== 501 && p.itemId === 9002 && (p.stage || "buying") === "buying");
    ok("bought-stage fix splits remainder to a standing buy", !!fixed && fixed.qty === 18 && fixed.stage === "bought"
       && !!rem && rem.qty === 5 && rem.buy === 27000, JSON.stringify(DB.positions));
    DB.positions = [{ id: 502, itemId: 9002, name: "Probe beta", qty: 23, buy: 27000, placedAt: nowMs - 3600e3, stage: "bought", stageAt: nowMs }];
    window.confirm = () => false;  // remainder never filled
    promptQ.push("18");
    partialPosition(502);
    ok("bought-stage fix can drop the remainder", DB.positions.length === 1 && DB.positions[0].qty === 18, JSON.stringify(DB.positions));
    window.confirm = () => true;
    const flipsBefore = DB.flips.length;
    DB.positions = [{ id: 503, itemId: 9002, name: "Probe beta", qty: 23, buy: 27000, placedAt: nowMs - 3600e3, stage: "selling", ask: 28188, stageAt: nowMs }];
    promptQ.push("18");
    fixSellQty(503);
    ok("selling-stage fix qty corrects without logging", DB.positions[0].qty === 18 && DB.flips.length === flipsBefore, JSON.stringify(DB.positions));
    ok("bought stage offers the fix button", /data-part="503"/.test(posActions({ id: 503, stage: "bought", qty: 1 }))
       && /fix qty…/.test(posActions({ id: 503, stage: "bought", qty: 1 })));
    DB.positions = [];

    // ═══ EXPORT NAG SNOOZE (friction, Aug 9 2026) ═══
    DB.lastExportAt = 0;
    DB.lastReviewAt = nowMs;
    DB.checks = { date: today(), walkup: CHECKLISTS.walkup.steps.map((s2, i2) => i2), weekly: [] };
    DB.nudgeSnooze = {};
    const mv1 = nextMove();
    ok("export nag surfaces with snooze key", /Export the log/.test(mv1.msg) && mv1.snoozeKey === "export", JSON.stringify(mv1));
    renderNow();
    ok("NOW bar renders the dismiss control", /data-nowsnooze="export"/.test(document.querySelector("#nowBar").innerHTML));
    DB.nudgeSnooze.export = today();
    const mv2 = nextMove();
    ok("snoozed for today", !/Export the log/.test(mv2.msg), JSON.stringify(mv2));
    DB.nudgeSnooze.export = yd;
    const mv3 = nextMove();
    ok("snooze expires next day", /Export the log/.test(mv3.msg) && mv3.snoozeKey === "export", JSON.stringify(mv3));
    DB.nudgeSnooze = {};

    // ═══ CO-MOVEMENT DETECTOR END-TO-END (no network: cached series + wiki cache) ═══
    mkItem(9004, "Probe delta"); mkItem(9005, "Probe epsilon"); mkItem(9006, "Probe zeta");
    DB.watch = [9001,9002,9003,9004,9005,9006].map(id => ({ id, qty: null }));
    DB.clusters = []; DB.clusterCands = []; DB.lastCoScanAt = 0;
    DB.clusterCorr = 0.5; DB.clusterMinDays = 20;
    const d0 = Date.parse("2026-07-10T00:00:00Z");
    const mkDays = (retFn, nDays) => {
      const days = []; let mid = 1000;
      for (let t = 0; t < nDays; t++){
        days.push({ d: new Date(d0 + t * 86400e3).toISOString().slice(0, 10), mid });
        mid = mid * (1 + retFn(t));
      }
      return days;
    };
    const p = t => (t % 2 ? 0.03 : -0.03);
    const q = t => [0.02, 0.02, -0.02, -0.02][t % 4];
    const rr = t => [0.02, -0.01, -0.01][t % 3];
    dailyCache.set(9001, { at: Date.now(), days: mkDays(p, 26) });
    dailyCache.set(9002, { at: Date.now(), days: mkDays(p, 26) });
    dailyCache.set(9003, { at: Date.now(), days: mkDays(t => p(t) * 0.9, 26) });
    dailyCache.set(9004, { at: Date.now(), days: mkDays(q, 26) });
    dailyCache.set(9005, { at: Date.now(), days: mkDays(rr, 26) });
    dailyCache.set(9006, { at: Date.now(), days: mkDays(p, 6).map(x => ({ d: x.d, mid: x.mid })) });
    const wc = { v: 1, byName: {} };
    wc.byName["Probe alpha"]   = { at: Date.now(), cats: ["Probe Trails rewards", "Probe Dormant Cat"] };
    wc.byName["Probe beta"]    = { at: Date.now(), cats: ["Probe Trails rewards"] };
    wc.byName["Probe gamma"]   = { at: Date.now(), cats: ["Probe Trails rewards"] };
    wc.byName["Probe delta"]   = { at: Date.now(), cats: ["Probe Dormant Cat"] };
    wc.byName["Probe epsilon"] = { at: Date.now(), cats: ["Probe Dormant Cat"] };
    wc.byName["Probe zeta"]    = { at: Date.now(), cats: [] };
    localStorage.setItem("gef.wikicats.v1", JSON.stringify(wc));
    await runClusterScan(true);
    const susp = DB.clusterCands.find(x => x.sig === "9001,9002,9003");
    ok("detector flags the co-moving trio", !!susp && susp.status === "suspected"
       && susp.evidence && susp.evidence.corr > 0.5 && susp.evidence.days >= 20,
       JSON.stringify(DB.clusterCands.map(x => x.sig + ":" + x.status)));
    ok("wiki story attached to suspected", !!susp && susp.story === "all: Probe Trails rewards", susp ? susp.story : "no cand");
    const dorm = DB.clusterCands.find(x => x.sig === "9001,9004,9005");
    ok("dormant candidate from shared rare category", !!dorm && dorm.status === "dormant" && /story without smoke/.test(dorm.story),
       JSON.stringify(DB.clusterCands.map(x => x.sig + ":" + x.status)));
    ok("uncorrelated items not clustered", !DB.clusterCands.some(x => x.status === "suspected" && x.sig !== "9001,9002,9003"),
       JSON.stringify(DB.clusterCands.map(x => x.sig + ":" + x.status)));
    ok("thin-data guard reports, never flags", S.cluThin.indexOf("Probe zeta") >= 0
       && !DB.clusterCands.some(x => x.members.indexOf(9006) >= 0), JSON.stringify(S.cluThin));
    ok("scan stamps lastCoScanAt", DB.lastCoScanAt > 0);

    // ═══ VOL5 BINDING RULE (ruled Aug 10 2026: ≥5 units AND 2 consecutive below-floor refreshes) ═══
    // Fixture floor at buy 4000 is volFloorFor(4000) = 500/h. Reset log state so
    // the 2-wins waiver can't mask the gate, and keep the walk-up stamp fresh.
    DB.flips = []; DB.positions = []; DB.watch = [{id:9001, qty:null}];
    DB.clusters = []; DB.planPriority = []; DB.planDemoted = [];
    DB.touchLog = [{d: today(), m: "walkup", t: Date.now()}];
    S.vol5Low = new Map();
    ok("vol5 floor fixture", volFloorFor(4000) === 500, String(volFloorFor(4000)));

    // /5m missing → 1h rules, labeled pending, never silent
    delete S.min5[9001];
    let cV = candidateFor({id:9001, qty:null});
    ok("5m pending: 1h rules + labeled", !cV.failed && cV.volGate === 50000 && cV.volSrc === "1h only — 5m pending",
       JSON.stringify({f: cV.failed, v: cV.volGate, s: cV.volSrc}));

    // 1 unit in the window (the '12/h' signature) → noise, never binds, labeled
    S.min5[9001] = { highPriceVolume: 0, lowPriceVolume: 1 };
    updateVol5Streaks(); updateVol5Streaks();   // even repeated arrivals of noise never arm the streak
    cV = candidateFor({id:9001, qty:null});
    ok("sub-5-unit window is labeled noise and never binds", !cV.failed && cV.volGate === 50000
       && /noise, not measurement/.test(cV.volSrc) && (S.vol5Low.get(9001) || 0) === 0,
       JSON.stringify({f: cV.failed, v: cV.volGate, s: cV.volSrc, n: S.vol5Low.get(9001)}));

    // real (≥5-unit) below-floor sample: first refresh does NOT bind
    S.min5[9001] = { highPriceVolume: 2, lowPriceVolume: 4 };   // 6 units → 72/h, under the 500/h floor
    updateVol5Streaks();
    cV = candidateFor({id:9001, qty:null});
    ok("first below-floor refresh: not binding yet, labeled n/2", !cV.failed && cV.volGate === 50000
       && /1\/2 consecutive refreshes — not binding yet/.test(cV.volSrc),
       JSON.stringify({f: cV.failed, v: cV.volGate, s: cV.volSrc}));

    // second consecutive refresh → binds, benches, copy names the 5m component and the 1h number
    updateVol5Streaks();
    cV = candidateFor({id:9001, qty:null});
    ok("second below-floor refresh binds and benches with 5m-named reason", !!cV.failed
       && /by the 5m sample/.test(cV.failed) && /1h thin side says/.test(cV.failed) && cV.volGate === 72,
       JSON.stringify({f: cV.failed, v: cV.volGate}));

    // recovery resets the streak and the gate reopens
    S.min5[9001] = { highPriceVolume: 4000, lowPriceVolume: 4000 };
    updateVol5Streaks();
    cV = candidateFor({id:9001, qty:null});
    ok("healthy 5m window resets streak and reopens gate", !cV.failed && (S.vol5Low.get(9001) || 0) === 0
       && cV.volGate === 50000, JSON.stringify({f: cV.failed, n: S.vol5Low.get(9001), v: cV.volGate}));

    // ═══ PROMOTE FLOW (friction Aug 10 2026: fund first, reason-aware picker) ═══
    DB.flips = []; DB.positions = []; DB.invLots = [];
    DB.watch = [{id:9001,qty:null},{id:9002,qty:null},{id:9003,qty:null}];
    DB.clusters = [{ id:1, name:"probe-cluster", members:[9001,9002], capPct:null, story:"", src:"manual", confirmedAt: Date.now() }];
    DB.clusterCands = []; DB.planPriority = []; DB.planDemoted = []; DB.planDate = today();
    DB.slots = 7; DB.minExpectGp = 0; DB.t1Budget = 100e6; DB.t2Budget = 50e6;
    DB.touchLog = [{d: today(), m: "walkup", t: Date.now()}];
    S.vol5Low = new Map(); S.promoteFor = null;
    const plP = buildPlan();
    const nuP = plP.nextUp.find(n => n.id === 9001 || n.id === 9002);
    ok("nextUp carries machine-readable whyKey", !!nuP && nuP.whyKey === "cluster" && nuP.whyClusterId === 1,
       JSON.stringify(plP.nextUp.map(n => n.id + ":" + n.whyKey)));

    // promoting the cluster-blocked member would evict its partner → picker, priority reverted
    promoteFromNextUp(nuP.id);
    ok("evicting promote opens the picker instead of silently swapping",
       S.promoteFor === nuP.id && DB.planPriority.length === 0,
       JSON.stringify({prom: S.promoteFor, prio: DB.planPriority}));
    S.tab = "watch"; renderWatch();
    const pkHTML = document.querySelector("#planList").innerHTML;
    const partnerId = nuP.id === 9001 ? 9002 : 9001;
    ok("picker offers only demotions that free the cluster cap",
       new RegExp('data-demote="' + partnerId + '"').test(pkHTML)
       && !/data-demote="9003"/.test(pkHTML) && /free its exposure cap/.test(pkHTML),
       pkHTML.slice(Math.max(0, pkHTML.indexOf('class="picker"')), pkHTML.indexOf('class="picker"') + 400));

    // end-to-end: pressing the offered demotion funds the promoted member
    document.querySelector('#planList [data-demote="' + partnerId + '"]').click();
    const plQ = buildPlan();
    ok("demote press funds the promoted member",
       S.promoteFor === null && plQ.picks.some(p => p.id === nuP.id) && !plQ.picks.some(p => p.id === partnerId),
       JSON.stringify({picks: plQ.picks.map(p => p.id), prom: S.promoteFor}));

    // honest dead-end: T2 item behind an exhausted T2 budget — no demotion helps and the picker says so
    mkItem(9020, "Probe theta");
    S.latest[9020] = { high: 8800, low: 8000, highTime: nowS-60, lowTime: nowS-120 };
    S.hour[9020]   = { avgHighPrice: 8800, avgLowPrice: 8000, highPriceVolume: 50000, lowPriceVolume: 50000 };
    DB.qual[9020] = qualified();
    DB.planPriority = []; DB.planDemoted = [];
    DB.watch = [{id:9003,qty:null},{id:9020,qty:null}];
    DB.clusters = []; DB.t2Budget = 0;
    const plR = buildPlan();
    const nuR = plR.nextUp.find(n => n.id === 9020);
    ok("T2 item behind zero T2 budget lands nextUp with whyKey budget", !!nuR && nuR.whyKey === "budget",
       JSON.stringify({next: plR.nextUp.map(n => n.id + ":" + n.whyKey), bench: plR.bench.map(b => b.name + ": " + b.failed)}));
    promoteFromNextUp(9020);
    S.tab = "watch"; renderWatch();
    const pkHTML2 = document.querySelector("#planList").innerHTML;
    const pk2 = pkHTML2.slice(Math.max(0, pkHTML2.indexOf('class="picker"')));
    ok("picker states no demotion frees the exhausted tier budget",
       S.promoteFor === 9020 && /budget is exhausted and no funded pick draws on it/.test(pk2)
       && !/data-demote=/.test(pk2), pk2.slice(0, 400));
    S.promoteFor = null; DB.t2Budget = 50e6;
    // restore cluster state for the blocks below
    DB.clusters = [{ id:1, name:"probe-cluster", members:[9001,9002], capPct:null, story:"", src:"manual", confirmedAt: Date.now() }];

    // ═══ DISMISSED-VARIANT ABSORPTION (ruled Aug 10 2026: Jaccard ≥ 0.6) ═══
    DB.clusterCands = [];
    const cd = upsertCand([9002,9003,9004], { status:"suspected", src:"comove", story:"co-moves — reason unknown", evidence:{corr:0.7, days:25} });
    cd.status = "dismissed"; cd.dismissedAt = Date.now();
    // J({9002,9003,9004},{9002,9003,9004,9005}) = 3/4 = 0.75 ≥ 0.6 → absorbed, evidence merged, never re-queued
    const v1 = upsertCand([9002,9003,9004,9005], { status:"suspected", src:"comove", story:"co-moves — reason unknown", evidence:{corr:0.8, days:26} });
    ok("dismissed variant absorbed, evidence merged silently", v1 === null && DB.clusterCands.length === 1
       && cd.variants === 1 && cd.evidence.corr === 0.8 && cd.status === "dismissed",
       JSON.stringify(DB.clusterCands));
    // J({9002,9003,9004},{9002,9005,9006}) = 1/5 = 0.2 < 0.6 → genuinely new, queues normally
    const v2 = upsertCand([9002,9005,9006], { status:"suspected", src:"comove", story:"co-moves — reason unknown", evidence:{corr:0.9, days:20} });
    ok("low-overlap detection is a new candidate", !!v2 && v2.status === "suspected" && DB.clusterCands.length === 2,
       JSON.stringify(DB.clusterCands.map(x => x.sig + ":" + x.status)));
    S.tab = "watch"; renderClusters();
    ok("queue line counts dismissed and absorbed variants",
       /1 dismissed, 1 variant absorbed/.test(document.querySelector("#cluQueueSum").textContent),
       document.querySelector("#cluQueueSum").textContent);
    const vAbs = validateImport(JSON.parse(JSON.stringify({ clusterCands: DB.clusterCands })));
    ok("import keeps variant bookkeeping", vAbs.db.clusterCands.some(x => x.variants === 1 && x.status === "dismissed"),
       JSON.stringify(vAbs.db.clusterCands));

    // ═══ SUSTAINED QUALIFICATION (spec'd, found dropped, built Aug 10 2026) + full-chain fails ═══
    DB.flips = []; DB.positions = []; DB.watch = [{id:9001, qty:null}];
    DB.clusters = []; DB.planPriority = []; DB.planDemoted = []; DB.qual = {}; DB.gateLog = [];
    DB.slots = 7; DB.t1Budget = 100e6; DB.t2Budget = 50e6; DB.minExpectGp = 0;
    DB.touchLog = [{d: today(), m: "walkup", t: Date.now()}];
    S.vol5Low = new Map();

    // first pass this snapshot → qualifying 1/3, unfunded, ETA in the future, ledgered
    S.qualStamp = null;
    let plS = buildPlan();
    ok("first-time passer seasons instead of funding", plS.picks.length === 0 && plS.qualifying.length === 1
       && plS.qualifying[0].id === 9001 && plS.qualifying[0].qual.n === 1 && plS.qualifying[0].qual.eta > Date.now(),
       JSON.stringify({picks: plS.picks.map(p => p.id), q: plS.qualifying.map(q => ({id: q.id, n: q.qual.n})),
                       bench: plS.bench.map(b => b.name + ": " + b.failed)}));
    ok("seasoning delay ledgered for the audit", DB.gateLog.some(e => e.g === "seasoning" && e.id === 9001),
       JSON.stringify(DB.gateLog.slice(-4)));

    // re-render of the same data snapshot is not new evidence
    plS = buildPlan();
    ok("same snapshot never double-counts a pass", DB.qual[9001].n === 1, JSON.stringify(DB.qual));

    // an hour later (simulated), the next pass counts
    DB.qual[9001].lastAt -= 3600e3 + 1; DB.qual[9001].firstAt -= 3600e3 + 1;
    S.qualStamp = null;
    plS = buildPlan();
    ok("pass an hour apart advances the streak", DB.qual[9001].n === 2 && plS.qualifying[0].qual.n === 2,
       JSON.stringify(DB.qual));

    // a failed evaluation resets — consecutive means consecutive
    const okHigh = S.latest[9001].high;
    S.latest[9001].high = 4010;
    S.qualStamp = null;
    buildPlan();
    ok("failed pass resets the streak", !DB.qual[9001], JSON.stringify(DB.qual));
    S.latest[9001].high = okHigh;

    // 3 counted passes spanning ≥2h → fundable
    DB.qual[9001] = { n: 3, firstAt: Date.now() - 3 * 3600e3, lastAt: Date.now() - 1800e3 };
    S.qualStamp = null;
    plS = buildPlan();
    ok("3 passes spanning 2h qualify for funding", plS.picks.some(p => p.id === 9001) && plS.qualifying.length === 0,
       JSON.stringify({picks: plS.picks.map(p => p.id), q: plS.qualifying.map(q => q.id)}));

    // measurement waives seasoning, reason stated on the funded line
    DB.qual = {}; S.qualStamp = S.latestAt + "|" + S.hourAt;
    DB.flips = [{ id: Date.now() - 86400e3, itemId: 9001, name: "Probe alpha", qty: 10, buy: 4000, sell: 4400, date: today(), note: "" }];
    plS = buildPlan();
    const wvQ = plS.picks.find(p => p.id === 9001);
    ok("logged round trip waives seasoning with stated reason",
       !!wvQ && (wvQ.sizeNotes || []).some(s => /seasoning waived — logged round trip/.test(s)),
       JSON.stringify({picks: plS.picks.map(p => ({id: p.id, notes: p.sizeNotes})), q: plS.qualifying.map(q => q.id)}));
    DB.flips = [];

    // the qualifying pipeline renders with count and ETA copy
    DB.qual = {}; S.qualStamp = null;
    S.tab = "watch"; renderWatch();
    const qHTML = document.querySelector("#planList").innerHTML;
    ok("plan renders the qualifying pipeline", /QUALIFYING 1\/3/.test(qHTML) && /qualifies at ~/.test(qHTML)
       && /margin-test it/.test(qHTML), qHTML.slice(Math.max(0, qHTML.indexOf("QUALIFYING")), Math.max(0, qHTML.indexOf("QUALIFYING")) + 300));

    // full-chain evaluation: every failure collected, headline = first, gaps carry have/need
    S.latest[9002] = { high: 4010, low: 4000, highTime: nowS-60, lowTime: nowS-120 };
    S.hour[9002]   = { avgHighPrice: 4400, avgLowPrice: 4000, highPriceVolume: 50000, lowPriceVolume: 100 };
    const cF = candidateFor({ id: 9002, qty: null });
    ok("full chain collects every failure with the same headline", (cF.fails || []).length >= 3
       && cF.failed === cF.fails[0].detail && /sustained ROI/.test(cF.failed)
       && cF.fails.some(f => f.g === "flow imbalance") && cF.fails.some(f => f.g === "volume floor"),
       JSON.stringify((cF.fails || []).map(f => f.g)));
    ok("gate gaps carry have/need/short for the near-miss view",
       cF.fails.every(f => f.detail) && cF.fails.some(f => f.have != null && f.need != null && f.short),
       JSON.stringify(cF.fails));
    S.latest[9002] = { high: 4400, low: 4000, highTime: nowS-60, lowTime: nowS-120 };
    S.hour[9002]   = { avgHighPrice: 4400, avgLowPrice: 4000, highPriceVolume: 50000, lowPriceVolume: 50000 };
    DB.qual = { 9001: qualified(), 9002: qualified(), 9003: qualified() };
    S.qualStamp = S.latestAt + "|" + S.hourAt;

    // ═══ DEPLOYMENT PANEL: funnel, near-miss split, pipeline, proposals ═══
    // Cast: 9001 funded (qualified) · 9031-9033 tax-exempt ROI near-misses
    // (1.15/1.10/1.05% vs the 1.2% floor) · 9002 a multi-gate wreck · 9003 qualifying.
    DB.flips = []; DB.positions = []; DB.clusters = []; DB.planPriority = []; DB.planDemoted = [];
    DB.gateLog = []; DB.slots = 7; DB.minExpectGp = 0; DB.t1Budget = 100e6; DB.t2Budget = 50e6;
    DB.touchLog = [{d: today(), m: "walkup", t: Date.now()}];
    S.vol5Low = new Map();
    const mkNearMiss = (id, nm, sell) => {
      mkItem(id, nm);
      exemptIds.add(id);   // tax 0 → the ROI floor binds before the 3×tax margin floor can
      S.latest[id] = { high: sell, low: 4000, highTime: nowS-60, lowTime: nowS-120 };
      S.hour[id]   = { avgHighPrice: sell, avgLowPrice: 4000, highPriceVolume: 50000, lowPriceVolume: 50000 };
    };
    mkNearMiss(9031, "Probe near-a", 4046);   // ROI 1.15%
    mkNearMiss(9032, "Probe near-b", 4044);   // ROI 1.10%
    mkNearMiss(9033, "Probe near-c", 4042);   // ROI 1.05%
    S.latest[9002] = { high: 4010, low: 4000, highTime: nowS-60, lowTime: nowS-120 };   // multi-gate wreck
    S.hour[9002]   = { avgHighPrice: 4400, avgLowPrice: 4000, highPriceVolume: 50000, lowPriceVolume: 100 };
    DB.watch = [9001, 9002, 9003, 9031, 9032, 9033].map(id => ({ id, qty: null }));
    DB.qual = { 9001: qualified(), 9002: qualified(), 9031: qualified(), 9032: qualified(), 9033: qualified() };
    S.qualStamp = null;   // 9003 has no streak → seasons this snapshot
    S.tab = "watch"; renderWatch();
    const dep = document.querySelector("#depBody").innerHTML;
    ok("funnel renders enter → kills → funded", /candidates enter/.test(dep) && /funded/.test(dep)
       && /ROI floor/.test(dep) && /seasoning \(qualifying\)/.test(dep), dep.slice(0, 600));
    // ROI floor kills 4 first-fail (the 3 near-misses + the wreck's first failure)
    ok("funnel kills 4 at the ROI floor and flags it a top killer", /⚑ ROI floor/.test(dep) && /−4 · 2 remain/.test(dep),
       dep.slice(0, 800));
    ok("near-miss split shows the one number short", /3 near-misses/.test(dep)
       && /sustained ROI 1\.15% vs 1\.2% floor/.test(dep), dep);
    ok("multi-gate wreck listed as genuinely unfit", /Multi-gate \(3\+\), genuinely unfit/.test(dep)
       && /Probe beta \(\d+ gates\)/.test(dep), dep);
    ok("pipeline shows the seasoning item with an ETA", /Probe gamma/.test(dep) && /qualifies at ~/.test(dep), dep);
    ok("proposal indicts the ROI floor with numbers, propose-only", /ROI floor<\/b> alone blocks 3 items/.test(dep)
       && /Propose: sustained-ROI floor 1\.2% → 1\.1%/.test(dep) && /your ruling/.test(dep)
       && /nothing changes without your per-gate ruling/i.test(dep), dep);
    // teardown: restore 9002, drop the extras
    S.latest[9002] = { high: 4400, low: 4000, highTime: nowS-60, lowTime: nowS-120 };
    S.hour[9002]   = { avgHighPrice: 4400, avgLowPrice: 4000, highPriceVolume: 50000, lowPriceVolume: 50000 };
    DB.watch = [{id:9001,qty:null},{id:9002,qty:null},{id:9003,qty:null}];
    DB.qual = { 9001: qualified(), 9002: qualified(), 9003: qualified() };
    S.qualStamp = S.latestAt + "|" + S.hourAt;

    // ═══ CLUSTERS TAB: thesis detail (matrix, decay view, overlay) ═══
    // dailyCache still holds the detector fixtures: 9001/9002 co-move (p),
    // 9003 tracks them at 0.9×, 9004 diverges (q), 9005 a third pattern.
    DB.clusters = [{ id: 5, name: "probe-detail", members: [9001, 9002, 9004], capPct: null, story: "", src: "manual", confirmedAt: Date.now() }];
    DB.watch = [9001, 9002, 9003, 9004, 9005].map(id => ({ id, qty: null }));
    S.tab = "clusters"; renderClusters();
    const ledger = document.querySelector("#cluBody").innerHTML;
    ok("cluster ledger offers the detail button in the name cell", /data-cldetail="5"/.test(ledger), ledger.slice(0, 300));
    ok("ledger members are wrapping chips with no inline removal", /memchip/.test(ledger) && !/data-clrm/.test(ledger)
       && /white-space:normal/.test(ledger), ledger.slice(0, 500));
    await openClusterDetail(5);
    const det = document.querySelector("#cluDetail").innerHTML;
    ok("thesis detail renders all three views", /Pairwise excess correlation/.test(det)
       && /Correlation over time/.test(det) && /Members, overlaid/.test(det), det.slice(0, 400));
    ok("matrix shows the co-moving pair strong", /class="num pos"/.test(det), det.slice(0, 1200));
    ok("decay view renders rolling windows against the threshold", /rolling 10-day window/.test(det)
       && /skipped, not guessed/.test(det), det.slice(Math.max(0, det.indexOf("Correlation over time")), det.indexOf("Correlation over time") + 500));
    ok("overlay draws normalized member polylines", (det.match(/<polyline/g) || []).length >= 2
       && /normalized to its own first day/.test(det), String((det.match(/<polyline/g) || []).length));
    ok("member removal lives in the detail, deliberately", (det.match(/data-clrm="5:/g) || []).length === 3
       && /can't take an accidental press/.test(det), det.slice(Math.max(0, det.indexOf("Members — manage"))));
    // removal from the detail refreshes both views and is undoable
    document.querySelector('#cluDetail [data-clrm="5:9004"]').click();
    await new Promise(r => setTimeout(r, 1600));   // openClusterDetail re-fetch pacing (cached, ~250ms/id)
    ok("detail removal updates membership and re-renders", DB.clusters[0].members.join() === "9001,9002"
       && (document.querySelector("#cluDetail").innerHTML.match(/data-clrm="5:/g) || []).length === 2,
       JSON.stringify({members: DB.clusters[0].members}));
    // restore for the import round-trip
    DB.clusters = [{ id:1, name:"probe-cluster", members:[9001,9002], capPct:null, story:"", src:"manual", confirmedAt: Date.now() }];
    DB.watch = [{id:9001,qty:null},{id:9002,qty:null},{id:9003,qty:null}];

    // ---- import round-trip ----
    const v = validateImport(JSON.parse(JSON.stringify({ clusters: DB.clusters, clusterCands: DB.clusterCands,
      clusterCapPct: 8, clusterCorr: 0.6, clusterMinDays: 21, lastCoScanAt: 123, clSeedV1: 1,
      decisionLog: DB.decisionLog, gateLog: DB.gateLog, audRuled: DB.audRuled,
      qual: { 9001: { n: 2, firstAt: 100, lastAt: 200 }, 9999: { n: 0 } },
      nudgeSnooze: { export: "2026-08-09" } })));
    ok("import keeps qualification streaks, rejects malformed", v.db.qual["9001"] && v.db.qual["9001"].n === 2
       && !v.db.qual["9999"], JSON.stringify(v.db.qual));
    ok("import keeps cluster state", v.db.clusters.length === DB.clusters.length && v.db.clusterCands.length > 0
       && v.db.clusterCapPct === 8 && v.db.clusterCorr === 0.6 && v.db.clusterMinDays === 21,
       JSON.stringify({c: v.db.clusters.length, k: v.db.clusterCands.length}));
    ok("import keeps audit state", v.db.decisionLog.length === DB.decisionLog.length
       && v.db.gateLog.length === DB.gateLog.length && Object.keys(v.db.audRuled).length > 0
       && v.db.nudgeSnooze.export === "2026-08-09",
       JSON.stringify({dl: v.db.decisionLog.length, gl: v.db.gateLog.length, ns: v.db.nudgeSnooze}));
  } catch(e){
    out.push("FAIL exception :: " + (e && e.stack || e));
  }
  const fails = out.filter(l => l.indexOf("FAIL") === 0);
  document.title = fails.length ? "PROBE-FAIL " + fails.length : "PROBE-PASS";
  const pre = document.createElement("pre");
  pre.id = "probeOut";
  pre.textContent = "===PROBE===\n" + out.join("\n") + "\n===END===";
  document.body.appendChild(pre);
  try {
    fetch("http://127.0.0.1:8347/report", { method: "POST", mode: "no-cors",
      headers: { "Content-Type": "text/plain" }, body: document.title + "\n" + pre.textContent });
  } catch(e){}
})();
</script>
