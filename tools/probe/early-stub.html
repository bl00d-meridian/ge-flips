<script>
window.prompt = function(){ return null; };
window.confirm = function(){ return true; };
window.alert = function(){};
window.__probeErrs = [];
window.addEventListener("error", function(e){
  window.__probeErrs.push((e.message || "?") + " @ " + (e.filename || "") + ":" + (e.lineno || 0));
  try {
    fetch("http://127.0.0.1:8347/report", { method: "POST", mode: "no-cors",
      headers: { "Content-Type": "text/plain" },
      body: "PROBE SCRIPT-ERROR\n" + window.__probeErrs.join("\n") });
  } catch(_){}
});
</script>
